'use strict';const DATA={"bundles":["SUNDAY NIGHT · THE BUNDLES","Five hearing bundles. 4,812 pages. One USB stick. The Chair writes: “I assume we are all fully up to speed.” Then you see Exhibit R-847. You do not remember Exhibit R-847.",[["Read R-847 now. Sleep is a post-award remedy.","judgment",10,"R-847 matters in a way neither side has quite articulated. You mark one question for Monday.",{"judgment":8,"patience":-4},"openings"],["Trust the process. If it mattered, counsel would have made it clear.",null,0,"A sentence rarely spoken by experienced arbitrators, but tonight it is yours.",{"patience":5},"openings"],["Ask the Tribunal Secretary where R-847 sits in the pleadings.","judgment",8,"Paragraph 614 of the Rejoinder, footnote 1,209. Of course. Six pages instead of sixty-three.",{"judgment":5,"patience":3},"openings"]]],"openings":["MONDAY · OPENINGS","Claimant: “At its heart, this is a very simple case.” Ninety-four minutes later Respondent: “The dispute is actually remarkably straightforward.” Your notebook now says: WHY THEN 4,800 PAGES?",[["Ask the question that has bothered you since Sunday.","judgment",12,"The answer exposes the real disagreement in six minutes. Both teams quietly rewrite tomorrow’s witness plans.",{"judgment":8,"fairness":3},"witness"],["Listen. Let counsel open.","patience",9,"You underline three things. One will matter. At present all three believe they are the one.",{"judgment":3,"patience":-3},"witness"],["Enforce the clock.","authority",10,"The final twenty minutes are suddenly much better than the first seventy-four.",{"patience":6,"progress":3},"witness"]]],"witness":["TUESDAY · THE WITNESS","Counsel asks a yes-or-no question. Seven minutes later the witness is still explaining the context. COUNSEL: “Mr Weber, that wasn’t my question.” WITNESS: “I think it is important to understand the context.” The Tribunal now understands a remarkable amount of context.",[["Intervene: answer the question first, then explain.","authority",11,"Yes. Then context. Forty seconds. The transcript itself seems relieved.",{"patience":8,"fairness":3},"f117"],["Let counsel handle the witness.","patience",10,"Counsel tries again. The witness answers a different question more efficiently.",{"patience":-5},"f117"],["Ask your own question.","judgment",14,"The witness pauses. “I don’t know.” It is the clearest answer of the morning.",{"judgment":8},"f117"]]],"f117":["WEDNESDAY · THE EXPERT · CELL F117","Respondent’s expert Dr Pecunia is being cross-examined. Claimant walks him through the model, row by row. You looked at the native model last night. Cell F117 appears to point to the wrong row. Correcting it may move damages by a factor of ten. Counsel has not yet reached the consequence.",[["Say nothing. Let counsel earn the point.","judgment",12,"Three questions later the error lands. Dr Pecunia says “linkage issue”. The co-arbitrator beside you writes for a full minute.",{"judgment":8,"fairness":5},"questions"],["Ask: “Doctor, what happens if F117 is corrected?”","fairness",14,"The question is relevant, but the Tribunal must give both experts and both parties a proper opportunity to address the correction and its implications. The record, not a surprise, must carry the finding.",{"judgment":7,"fairness":-2,"progress":2},"questions"],["Note it for deliberations.","judgment",9,"You write: F117 — CHECK CONSEQUENCE. The note acquires a box around it, then a second box.",{"judgment":4},"questions"]]],"questions":["THURSDAY · TRIBUNAL QUESTIONS","The Chair has drafted 23 questions. You like seventeen, dislike three, and one tells the parties almost exactly how the Chair is leaning.",[["Challenge the list. Remove the revealing question.","cohesion",13,"The question is recast neutrally. “Yes, that’s better.” Tribunal language for a successful constitutional crisis.",{"cohesion":7,"fairness":7},"closings"],["Send them, but invite both sides to address implications.","fairness",10,"Procedurally fair. Intellectually untidy. Counsel respond with 74 slides.",{"fairness":5,"patience":-5},"closings"],["No list. Ask only what remains necessary at closing.","judgment",12,"The closings sharpen because nobody spent the night reverse-engineering 23 questions.",{"judgment":6,"progress":4},"closings"]]],"closings":["FRIDAY · 18:47 · CLOSINGS","Two hours each. Claimant uses 2:34. Respondent uses 2:41 and begins the final section: “In light of the time, I will be brief.” The Chair turns to the Tribunal: “Any final questions?” You have seven.",[["Ask the two questions that could change your view.","judgment",12,"One answer helps. The other does not. More importantly, you now know why.",{"judgment":8,"progress":5},"challenge"],["One question only.","judgment",9,"You choose the uncomfortable one. Counsel pauses before answering. Good choice.",{"judgment":5,"patience":3},"challenge"],["Save them for deliberations.","patience",9,"The hearing closes at 19:03. Your seven questions become three when the door shuts.",{"patience":5},"challenge"]]],"delib":["FRIDAY · 19:30 · DELIBERATIONS","FIRST VOTE. Chair: Claimant. Co-Arbitrator 1: Respondent. Co-Arbitrator 2: “We need to distinguish liability from causation.” It is 19:32. Your flight leaves at 09:10.",[["Push your view. Start with the point everyone avoids.","cohesion",14,"The disagreement becomes precise. Nobody changes position yet, but everyone is now disagreeing about the same thing.",{"judgment":8,"progress":10,"cohesion":2},"award"],["Test your own position. Ask the others to attack it.","judgment",12,"One objection lands. You change part of your view. Irritating and useful. The Tribunal moves.",{"judgment":10,"cohesion":10,"progress":12},"award"],["Find the narrow ground all three can decide tonight.","cohesion",11,"Four islands of agreement appear: jurisdiction, standard, two liability propositions and quantum methodology.",{"cohesion":8,"progress":15},"award"]]],"award":["THREE WEEKS LATER · DRAFT AWARD v1","187 pages. 643 tracked changes. 127 comments. One co-arbitrator writes: “I have made only a few minor suggestions.” The attachment is 11 MB. Footnote 312 is 19 lines and developing its own legal personality.",[["Mark and return everything.","patience",13,"Your 86 comments are annoying, specific and mostly useful. Draft v2 is shorter by nine pages.",{"progress":18,"cohesion":-3},"dissent"],["Discuss the five big issues first.","cohesion",11,"A 55-minute call removes 300 future comments. Possibly the most efficient event of Hearing Week, despite occurring three weeks later.",{"progress":22,"cohesion":7},"dissent"],["Accept most; fight the dispositive and reasons.","judgment",10,"Fourteen stylistic preferences live. Everyone retains energy for the paragraph deciding €420 million.",{"judgment":6,"progress":18,"cohesion":5},"dissent"]]],"dissent":["DRAFT AWARD v4 · THE 2–1 PROBLEM","On an important issue, the majority is against you. A separate opinion is available, but neither a duty nor a substitute for careful deliberation. The institution’s rules and applicable law still matter.",[["Join the award. You have been heard.","cohesion",12,"You negotiate two paragraphs fairly stating the losing argument. You sign without pretending you agreed.",{"cohesion":10,"progress":15},"send"],["Write a short separate opinion.","judgment",14,"Four pages. One issue. No adjectives about the majority. The Tribunal survives.",{"judgment":8,"cohesion":-4,"progress":8},"send"],["Dissent fully.","judgment",16,"Precise, restrained and impossible to mistake for agreement. Drafting takes longer. Of course it does.",{"judgment":10,"cohesion":-10,"progress":5},"send"]]],"send":["FRIDAY · 23:48 · FINAL AWARD","The final draft is ready. The institution awaits it. Before release, the Tribunal must verify the dispositive section, arithmetic, signatures, formal requirements and any institutional scrutiny process that applies.",[["Read it once more.","judgment",10,"You find a transposed digit in the dispositive section. For once, the final read is not ritual.",{"judgment":10,"progress":10},"end"],["SEND.","patience",8,"The award leaves the Tribunal’s inbox and enters the world. This is more frightening than expected.",{"progress":20},"end"]]],"conflicts":["BEFORE THE FIRST PROCEDURAL ORDER · DISCLOSURE","Your firm has just taken on an unrelated matter for an affiliate of Claimant. The engagement was opened after your appointment. You are not involved. Your conflicts team calls it immaterial. The other side has not heard about it.",[["Disclose promptly, with sufficient detail, and invite observations.",null,0,"The parties can assess the circumstances for themselves. The calendar suffers; confidence does not.",{"fairness":10,"judgment":6,"progress":-3},"bundles"],["Discuss the issue confidentially with the Chair before deciding what to disclose.",null,0,"A useful internal conversation. But it does not replace an independent assessment of disclosure obligations.",{"cohesion":4,"fairness":-7},"bundles"],["No disclosure. The matters are unrelated.",null,0,"A challenge arrives when the affiliate appears in a footnote. The merits have not changed; the procedural risk has.",{"fairness":-25,"progress":-12,"cohesion":-9},"bundles"]]],"po":["PROCEDURAL ORDER NO. 1 · THE TIMETABLE","Claimant requests a broad document production phase. Respondent says it will add six months. The parties agree on precisely one point: the other side is being unreasonable.",[["Invite focused requests tied to identified issues and proportionality.",null,0,"The order makes counsel explain why each category matters. Both parties complain equally, which is not itself proof of fairness.",{"judgment":8,"fairness":9,"progress":5},"bundles"],["Grant the full request to avoid any suggestion of restricting evidence.",null,0,"The document universe expands. So does the timetable. A defensible procedural choice is not always a proportionate one.",{"fairness":1,"patience":-10,"progress":-14},"bundles"],["Reject production entirely to protect the hearing date.",null,0,"The schedule survives, but a material request was not properly considered. The procedural record may prove more expensive than disclosure.",{"progress":7,"fairness":-18},"bundles"]]],"challenge":["AFTER THE HEARING · THE LATE AUTHORITY","After closing submissions, the Tribunal finds a recent decision directly relevant to a dispositive issue. Neither party cited it. The Chair suggests inserting it into the award without further exchanges.",[["Invite short simultaneous submissions on the authority.",null,0,"A narrow opportunity to comment adds a week and removes a potentially serious due-process objection.",{"fairness":13,"judgment":8,"progress":-4},"delib"],["Rely on the decision; the Tribunal knows the law.",null,0,"The analysis may be sound. The parties were nevertheless denied a chance to address a decisive point.",{"judgment":2,"fairness":-22,"progress":4},"delib"],["Avoid the authority, even though it is relevant.",null,0,"The award remains procedurally comfortable but the legal analysis loses a useful foundation.",{"fairness":3,"judgment":-9,"progress":3},"delib"]]]};const SAVE='arbitrator-week-v2';let S=null;let current='';const app=document.getElementById('app'),st=document.getElementById('status'),cover=document.getElementById('cover'),game=document.getElementById('game');
const clamp=n=>Math.max(0,Math.min(100,n));
function fresh(){return {role:null,judgment:55,patience:65,authority:55,cohesion:65,fairness:75,progress:18,history:[],risk:0}}
function paint(){st.innerHTML=[['Judgment',S.judgment],['Patience',S.patience],['Authority',S.authority],['Cohesion',S.cohesion],['Due process',S.fairness],['Award',S.progress+'%']].map(([k,v])=>'<span>'+k.toUpperCase()+' '+v+'</span>').join('')}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({S,current}))}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem(SAVE));if(d&&d.S&&d.current){S=d.S;current=d.current;cover.hidden=true;game.hidden=false;paint();if(current==='role')role();else if(current==='end')ending();else show(current);return true}}catch(e){}return false}
function start(){S=fresh();cover.hidden=true;game.hidden=false;paint();role()}
function role(){current='role';save();app.innerHTML='<div class="stamp">Constitution of the Tribunal</div><p class="narr">Two parties. Three arbitrators. One award. You cannot win every procedural argument. You can still get the process right.</p>';[['chair','THE PRESIDING ARBITRATOR','You manage the procedure, coordinate deliberations and carry the drafting burden. Every email is somehow addressed to you.'],['co','THE CO-ARBITRATOR','You safeguard independent judgment, challenge the Chair constructively and decide when a quiet objection matters more than a dramatic speech.']].forEach(x=>{let b=document.createElement('button');b.className='role';b.innerHTML='<b>'+x[1]+'</b><span>'+x[2]+'</span>';b.onclick=()=>{S.role=x[0];show('conflicts')};app.appendChild(b)})}
function intro(id){let n=document.createElement('div');n.className='role-note';n.textContent=S.role==='chair'?'AS CHAIR: You must lead without pre-judging, and keep both co-arbitrators genuinely involved.':'AS CO-ARBITRATOR: You must decide independently while helping the Tribunal function as a collegial body.';app.appendChild(n)}
function show(id){if(id==='end'){current='end';save();return ending()}current=id;save();let [title,body,opts]=DATA[id];app.innerHTML='<div class="stamp">'+title+'</div><p class="narr">'+body+'</p>';intro(id);let options=opts.slice();if(id==='bundles'&&S.role==='chair')options=[...opts.slice(0,2),['Send a concise note identifying the disputed issue, without inviting premature submissions.',null,0,'The tribunal focuses its preparation on the real point without prejudging it.',{judgment:6,cohesion:5,progress:4},'openings']];if(id==='questions'&&S.role==='co')options=[...opts.slice(0,2),['Propose a neutral redraft privately to the Chair.',null,0,'The Chair accepts the point. The parties receive a question rather than a preview of the award.',{cohesion:9,fairness:10},'closings']];if(id==='po')options=opts.map(o=>[...o.slice(0,5),'bundles']);options.forEach((o,i)=>{let b=document.createElement('button');b.textContent=o[0];b.onclick=()=>resolve(o,id,i);app.appendChild(b)});let u=document.createElement('div');u.className='utility';u.innerHTML='<button id="restart">START AGAIN</button>';app.appendChild(u);document.getElementById('restart').onclick=()=>{if(confirm('Start a new tribunal? Your current progress will be lost.'))start()};window.scrollTo(0,0)}
function resolve(o,id,i){app.querySelectorAll('button').forEach(b=>b.disabled=true);let [choice,tag,dc,txt,delta,next]=o;let d={...delta};if(id==='conflicts'&&i===2)S.risk+=2;if(id==='po'&&i===2)S.risk+=2;if(id==='challenge'&&i===1)S.risk+=3;if(id==='f117'&&i===1)S.risk+=1;if(id==='send'&&i===1)S.risk+=1;
// Professional choices are deterministic: the dilemma lies in the consequences, not a random failure roll.
let a=[];for(let k in d){S[k]=clamp(S[k]+d[k]);a.push(k.toUpperCase()+' '+(d[k]>0?'+':'')+d[k])}S.history.push({id,choice});paint();save();let r=document.createElement('div');r.className='result';r.textContent=txt;let sm=document.createElement('small');sm.textContent=a.join(' · ');r.appendChild(sm);app.appendChild(r);let b=document.createElement('button');b.textContent='CONTINUE  →';b.onclick=()=>show(id==='conflicts'?'po':next);app.appendChild(b);b.scrollIntoView({behavior:'smooth',block:'nearest'})}
function ending(){current='end';save();let risk=S.risk+(S.fairness<55?2:0);let headline,description;if(risk>=4||S.fairness<40){headline='THE AWARD IS SENT. THE CHALLENGE FOLLOWS.';description='The merits may be sound. The procedural record gives the losing party an argument it did not need to have. The tribunal discovers that due process is not a decorative statistic.'}else if(S.judgment>=85&&S.fairness>=75&&S.cohesion>=65){headline='A REMARKABLY ROBUST AWARD.';description='The reasoning is clear, the parties were heard, and the tribunal addressed its disagreements without disguising them. Nobody calls the award perfect. This is an unusually good sign.'}else if(S.cohesion<45){headline='AN AWARD, AND THREE VERSIONS OF THE STORY.';description='The award is issued. The deliberations were difficult, the separate views remain visible, and the chair has stopped suggesting celebratory dinners.'}else if(S.progress<70){headline='THE AWARD IS OUT. EVENTUALLY.';description='A respectable outcome, achieved with more drafts and less sleep than anyone budgeted for. The institution will remember the timetable.'}else{headline='THE AWARD IS SENT.';description='A defensible award after a week of uncomfortable decisions. For approximately eleven minutes, nobody emails you.'}
app.innerHTML='<div class="eyebrow">FINAL DELIBERATIONS</div><div class="end"><strong>'+headline+'</strong><p>'+description+'</p><p><b>Your record:</b> Judgment '+S.judgment+' · Due process '+S.fairness+' · Tribunal cohesion '+S.cohesion+' · Drafting progress '+S.progress+'%</p><p class="tiny">This is a satirical game about professional judgment, not a statement of any particular arbitral rules or applicable law.</p></div><button id="again">CONSTITUTE ANOTHER TRIBUNAL</button>';document.getElementById('again').onclick=()=>{try{localStorage.removeItem(SAVE)}catch(e){}start()};window.scrollTo(0,0)}
function init(){let has=false;try{has=!!localStorage.getItem(SAVE)}catch(e){}if(has){let b=document.createElement('button');b.textContent='RESUME PREVIOUS TRIBUNAL';b.style.cssText='position:absolute;bottom:70px;left:10%;width:80%;text-align:center;background:#e9d6ae;z-index:2';b.onclick=e=>{e.stopPropagation();load()};cover.appendChild(b)}}init();
</script></body></html>
