<head>

<title>ASSOCIATE WEEK — The Importance of Being Billable</title>
<style>
  :root{
    --paper:#FAF8F2;
    --paper-deep:#F2EFE5;
    --ink:#22231F;
    --ink-soft:#6E6C63;
    --stamp:#B3121F;
    --annot:#1F3B73;
    --rule:#D8D3C4;
    --hl:#F3E27E;
    --ok:#2E6B3F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--paper-deep)}
  body{
    font-family:Georgia,'Times New Roman',serif;
    color:var(--ink);
    background:var(--paper-deep);
    line-height:1.55;
    padding:18px 10px 60px;
  }
  .sheet{
    max-width:680px;margin:0 auto;background:var(--paper);
    border:1px solid var(--rule);
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 8px 30px rgba(40,35,20,.10);
    padding:34px 34px 44px;
    position:relative;
  }
  @media (max-width:520px){ .sheet{padding:22px 16px 34px} }

  .mono{font-family:ui-monospace,'Courier New',monospace}

  /* ---------- letterhead ---------- */
  .letterhead{text-align:center;border-bottom:3px double var(--ink);padding-bottom:14px;margin-bottom:18px}
  .firm{font-variant:small-caps;letter-spacing:.22em;font-size:15px}
  .firm-sub{font-family:ui-monospace,'Courier New',monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase;margin-top:3px}
  h1{font-size:clamp(30px,7vw,44px);letter-spacing:.06em;font-weight:700;margin:18px 0 0;line-height:1.05}
  .wilde{font-style:italic;font-size:13.5px;color:var(--ink-soft);margin:4px 0 14px}
  .filebox{
    border:1.5px solid var(--ink);display:inline-block;padding:8px 16px;
    font-family:ui-monospace,'Courier New',monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;line-height:1.9;margin-bottom:16px
  }
  .intro{font-size:15px;max-width:52ch;margin:0 auto 6px;text-align:left}
  .intro p{margin-bottom:10px}

  /* ---------- meters ---------- */
  .hud{
    display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;
    border:1px solid var(--rule);background:#fff;
    padding:10px 12px;margin:0 0 18px;
    font-family:ui-monospace,'Courier New',monospace;font-size:10.5px;
    letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)
  }
  .meter{flex:1;min-width:120px}
  .meter .lab{display:flex;justify-content:space-between;margin-bottom:3px}
  .bar{height:8px;background:var(--paper-deep);border:1px solid var(--rule);position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--annot);transition:width .5s ease}
  .bar.sanity i{background:var(--ok)}
  .bar.low i{background:var(--stamp)}
  .ledger{flex:1;min-width:150px}
  .ledger .tally{
    border-bottom:1px solid var(--ink);color:var(--ink);
    font-size:13px;letter-spacing:.04em;display:flex;justify-content:space-between;
    padding-bottom:2px
  }
  .daytag{width:100%;color:var(--ink);font-size:10px;border-top:1px dashed var(--rule);padding-top:6px;margin-top:2px}

  /* ---------- scene ---------- */
  .stampline{
    font-family:ui-monospace,'Courier New',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;
    border-bottom:1px solid var(--rule);padding-bottom:6px
  }
  h2.scene-title{font-size:20px;letter-spacing:.04em;margin-bottom:12px;font-variant:small-caps}
  .scene-text p{margin-bottom:12px;font-size:15.5px}
  .scene-text em{color:var(--ink)}
  .aside{color:var(--ink-soft);font-style:italic}

  .choices{margin-top:20px;display:flex;flex-direction:column;gap:10px}
  button{
    font-family:Georgia,'Times New Roman',serif;font-size:15px;color:var(--ink);
    background:#fff;border:1px solid var(--ink);padding:12px 16px;text-align:left;
    cursor:pointer;line-height:1.4;width:100%;
  }
  button:hover{background:var(--hl)}
  button:focus-visible{outline:3px solid var(--annot);outline-offset:2px}
  button .tag{
    font-family:ui-monospace,'Courier New',monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-soft);display:block;margin-top:4px
  }
  button.continue{
    text-align:center;font-variant:small-caps;letter-spacing:.2em;
    border-width:2px;margin-top:22px
  }

  /* ---------- the stamp ---------- */
  .roll-stamp{
    display:inline-block;border:3px solid var(--stamp);color:var(--stamp);
    font-family:ui-monospace,'Courier New',monospace;font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;padding:8px 14px;transform:rotate(-4deg);
    margin:14px 0 6px;line-height:1.5;
    -webkit-mask-image:radial-gradient(circle at 30% 40%, black 92%, transparent 100%);
  }
  .roll-stamp b{font-size:17px;letter-spacing:.05em}
  .fx-line{
    font-family:ui-monospace,'Courier New',monospace;font-size:11.5px;color:var(--ink-soft);
    letter-spacing:.06em;margin-top:10px;border-top:1px dashed var(--rule);padding-top:8px
  }
  .fx-line span{white-space:nowrap;margin-right:12px}
  .fx-up{color:var(--ok)} .fx-down{color:var(--stamp)}

  .outcome p{margin-bottom:12px;font-size:15.5px}

  /* ---------- class cards ---------- */
  .classes{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .classes button b{font-variant:small-caps;letter-spacing:.06em}

  /* ---------- ending ---------- */
  .end-stamp{
    display:inline-block;border:3px double var(--stamp);color:var(--stamp);
    font-family:ui-monospace,'Courier New',monospace;font-size:13px;letter-spacing:.24em;
    padding:10px 20px;transform:rotate(-3deg);margin-bottom:18px
  }
  .end-title{font-size:26px;font-variant:small-caps;letter-spacing:.05em;margin-bottom:12px}
  .end-stats{
    font-family:ui-monospace,'Courier New',monospace;font-size:11.5px;color:var(--ink-soft);
    letter-spacing:.08em;text-transform:uppercase;margin:18px 0 6px;line-height:2;
    border-top:1px solid var(--rule);padding-top:12px
  }
  .footer-note{
    text-align:center;margin-top:28px;font-family:ui-monospace,'Courier New',monospace;
    font-size:10px;color:var(--ink-soft);letter-spacing:.14em;text-transform:uppercase
  }
  @media (prefers-reduced-motion:reduce){ .bar i{transition:none} }
</style>
</head>
<body>
<div id="jshint" style="max-width:640px;margin:26px auto;padding:14px 20px;border:1.5px solid #B3121F;color:#B3121F;font-family:Courier New,monospace;font-size:12px;letter-spacing:.06em;line-height:1.8;text-align:center;">NOTE: If this is all you can see, your viewer does not run JavaScript (e.g. the iPhone file preview). Please open this game in a proper browser on a computer — or via a web link.</div>
<div class="sheet" id="app" aria-live="polite"></div>

<script>
"use strict";
/* =====================================================================
   ASSOCIATE WEEK — The Importance of Being Billable
   A sequel, of sorts, to HEARING WEEK (Case No. ARB/26/D20).
   One self-contained file. No servers, no storage, no mercy.
   ===================================================================== */

const app = document.getElementById("app");

const CLASSES = [
  { id:"paladin", name:"The Billable Paladin",
    oath:"Oath of the Timesheet",
    desc:"Sworn never to leave an hour unrecorded. Radiates commitment in six-minute increments.",
    mech:"+2 on Endurance rolls · billable gains +25% · late nights cost a little extra Sanity",
    mods:{end:2,dra:0,soc:0,per:0,night:0}, hoursMult:1.25, nightTax:2, sanity:75, favor:55 },
  { id:"wizard", name:"The Contract Wizard",
    oath:"School of the Footnote",
    desc:"Speaks fluent boilerplate. Has opinions about the Oxford comma that have ended friendships.",
    mech:"+3 on Drafting rolls · −1 on Social rolls",
    mods:{end:0,dra:3,soc:-1,per:0,night:0}, hoursMult:1, nightTax:0, sanity:75, favor:55 },
  { id:"warlock", name:"The Coffee Warlock",
    oath:"Pact of the Espresso Machine",
    desc:"Has traded something — nobody asks what — for power after midnight.",
    mech:"+3 on rolls after dark · +1 Endurance · starts with less Sanity (the pact has a price)",
    mods:{end:1,dra:0,soc:0,per:0,night:3}, hoursMult:1, nightTax:0, sanity:62, favor:55 },
  { id:"bard", name:"The Networking Bard",
    oath:"College of the Coffee Chat",
    desc:"Knows everyone. Knows everyone's dog. Once got a mandate out of a funeral.",
    mech:"+3 on Social rolls · Partner Favor gains +25% · −1 on Drafting rolls",
    mods:{end:0,dra:-1,soc:3,per:0,night:0}, hoursMult:1, favorMult:1.25, nightTax:0, sanity:75, favor:60 },
  { id:"ranger", name:"The Corridor Ranger",
    oath:"Warden of the Stairwells",
    desc:"Knows which printer works, which partner is in, and which corridor avoids both.",
    mech:"+2 on Perception rolls · +1 on everything else",
    mods:{end:1,dra:1,soc:1,per:2,night:1}, hoursMult:1, nightTax:0, sanity:75, favor:55 },
];

let S = null;

function newState(cls){
  return { cls, hours:0, favor:cls.favor, sanity:cls.sanity, i:0, flags:{}, log:[] };
}

const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));
const d20 = ()=>1+Math.floor(Math.random()*20);

function applyFx(fx){
  const parts=[];
  if(fx.h){ const g = fx.h>0 ? fx.h*(S.cls.hoursMult||1) : fx.h; S.hours=Math.max(0,+(S.hours+g).toFixed(1)); parts.push(sp(g>0,`${g>0?"+":""}${g.toFixed(1)} billable`)); }
  if(fx.f){ const g = fx.f>0 ? Math.round(fx.f*(S.cls.favorMult||1)) : fx.f; S.favor=clamp(S.favor+g,0,100); parts.push(sp(g>0,`${g>0?"+":""}${g} Partner Favor`)); }
  if(fx.s){ let g=fx.s; if(g<0 && fx.night && S.cls.nightTax) g-=S.cls.nightTax; S.sanity=clamp(S.sanity+g,0,100); parts.push(sp(g>0,`${g>0?"+":""}${g} Sanity`)); }
  if(fx.flag){ S.flags[fx.flag]=true; }
  return parts.join("");
}
function sp(up,txt){ return `<span class="${up?"fx-up":"fx-down"}">${txt}</span>`; }

/* ---------------------------------------------------------------
   SCENES
   choice: {label, tag, dc, kind, night?, succ:{text,fx}, fail:{...}}
   or      {label, auto:{text,fx}}
--------------------------------------------------------------- */
const SCENES = [

{ day:"MONDAY", time:"09:04", title:"The Inbox",
  text:`<p>Forty-seven unread. Three flagged urgent. One from Friday, 11:58&nbsp;PM, subject line: <em>"quick thought"</em>. In this firm, no thought has ever been quick.</p>
        <p>Somewhere below the fold, an all-staff email announces that the fourth-floor printer "continues to be monitored."</p>`,
  choices:[
    { label:"Triage ruthlessly. Urgent, important, archive.", tag:"PERCEPTION · DC 10", dc:10, kind:"per",
      succ:{ text:`<p>Eleven minutes. Three replies, one forward, forty-three archived. You feel briefly, dangerously competent.</p>`, fx:{f:4,s:4} },
      fail:{ text:`<p>You archive with the confidence of the doomed. One of the forty-three was the client's revised instructions. You will learn this on Wednesday. Wednesday will not be gentle.</p>`, fx:{f:-6,s:-2} } },
    { label:"Answer everything. In order. Like a professional.", tag:"ENDURANCE · DC 12", dc:12, kind:"end",
      succ:{ text:`<p>Ninety minutes of correspondence, each reply courteous, precise, and secretly a small masterpiece nobody will ever cite. Timesheet narrative: <em>"0.8 — correspondence."</em> The word is doing heavy lifting.</p>`, fx:{h:1.2,f:4,s:-4} },
      fail:{ text:`<p>By reply nineteen your signature block has migrated into the middle of a sentence and you have wished someone "kind regards" twice in one email. You stop before real damage occurs. Probably.</p>`, fx:{h:0.6,s:-8} } },
    { label:"Coffee first. The inbox has waited all weekend; it can wait four minutes more.",
      auto:{ text:`<p>The machine performs its ritual. You watch. This is the closest thing to meditation the building permits, and the building charges it to overhead.</p>`, fx:{s:6} } },
  ]},

{ day:"MONDAY", time:"18:12", title:"The Quick Question",
  text:`<p>Dr.&nbsp;Aldric von Precedent materialises in your doorway. Partners do not walk; they materialise.</p>
        <p><em>"Quick one. Mark-up of the SPA — client would love it tomorrow morning. Shouldn't take long."</em> He places the document on your desk the way one places a sleeping dragon. <em>"It's only 118 pages."</em></p>`,
  choices:[
    { label:"\"Of course.\" Pull the all-nighter.", tag:"ENDURANCE · DC 13 · NIGHT", dc:13, kind:"end", night:true,
      succ:{ text:`<p>At 02:41 the mark-up is done, coherent, and — you check twice — addressed to the right people. You walk home through a city that has no idea clause 14.2 was ever in danger.</p>`, fx:{h:8,f:10,s:-12,night:true} },
      fail:{ text:`<p>The mark-up is done. It is even good. But at 03:12 you signed one comment bubble <em>"love, me"</em>, and there is no delete strong enough to make you forget that you did.</p>`, fx:{h:8,f:2,s:-18,night:true} } },
    { label:"Negotiate scope. \"Which clauses matter most for tomorrow?\"", tag:"SOCIAL · DC 14", dc:14, kind:"soc",
      succ:{ text:`<p>A pause. Partners are not often asked questions with answers. <em>"Clauses 8 through 14. The rest is Thursday."</em> You have just performed the rarest spell in the book: <em>Reduce Scope</em>. It is not taught. It is survived into.</p>`, fx:{h:4,f:6,s:-4} },
      fail:{ text:`<p><em>"All of it matters,"</em> he says, in the tone of a man for whom this is simply true. You now have the full mark-up <em>and</em> a faint note in his mental file. The note says: <em>asked.</em></p>`, fx:{h:8,f:-4,s:-14,night:true} } },
    { label:"Knock on Sera's door. The senior associate has seen things.",
      auto:{ text:`<p>Sera looks at the SPA, looks at you, and says, <em>"I have a template."</em> Of course she does. Sera has a template for grief. You split the document and finish by eleven. You owe her one. Sera keeps a ledger of those, too.</p>`, fx:{h:4,f:2,s:-4,flag:"sera"} } },
  ]},

{ day:"TUESDAY", time:"09:30", title:"The Data Room",
  text:`<p>3,812 documents. A folder called <span class="mono">Misc_final_v2_NEW</span>. Another called <span class="mono">Misc_final_v2_NEW (1)</span>. Somewhere in here, the deal's secrets sleep, guarded by scanned faxes rotated ninety degrees.</p>`,
  choices:[
    { label:"Read with intent. Something is hiding in here.", tag:"PERCEPTION · DC 12", dc:12, kind:"per",
      succ:{ text:`<p>Document DR-117. An email in which the seller's CFO writes, <em>"let's keep this out of the data room."</em> It is in the data room. You sit very still for a moment, the way one does upon finding treasure, then you draft the memo of your young life.</p>`, fx:{h:6,f:12,s:-4} },
      fail:{ text:`<p>Six hours. Four hundred documents. Your findings: the target company once disputed an invoice for cat-sitting services, vigorously, in 2019. You bill the time. The time was real. That is all that can be said for it.</p>`, fx:{h:6,s:-10} } },
    { label:"Build a search-term incantation first. Work smarter.", tag:"DRAFTING · DC 13", dc:13, kind:"dra",
      succ:{ text:`<p>Your Boolean string is a small sonnet of ANDs and NEARs. It surfaces forty documents; six of them matter. The review team regards you with the quiet awe usually reserved for whoever fixes the printer.</p>`, fx:{h:3,f:8,s:-2} },
      fail:{ text:`<p>Your search returns 3,811 hits. The one document it excludes is, you will later discover, the one that mattered. The machine is not mocking you. The machine does not need to.</p>`, fx:{h:3,s:-6} } },
    { label:"Methodically. Folder by folder. Someone has to.",
      auto:{ text:`<p>You descend in order, like a dungeon crawler who has read the manual. By evening you know this data room better than its makers do, which — given the folder names — is a low bar cleared with room to spare.</p>`, fx:{h:7,f:4,s:-8} } },
  ]},

{ day:"TUESDAY", time:"15:00", title:"The Marketing Quest",
  text:`<p>Ms.&nbsp;Melodia from Business Development appears, bearing a smile and a deadline. <em>"We'd love a LinkedIn post from you by Friday. Thought leadership. Authentic. Personal."</em></p>
        <p>A beat. <em>"Approved by three partners, obviously."</em></p>`,
  choices:[
    { label:"Write the earnest doctrinal post. Substance never hurt anyone.", tag:"DRAFTING · DC 12", dc:12, kind:"dra",
      succ:{ text:`<p>Twelve hundred words on a genuinely interesting point, trimmed to four hundred by forces beyond your control. It performs respectably. A general counsel comments <em>"Useful."</em> In this economy, that is a standing ovation.</p>`, fx:{f:8,s:-2} },
      fail:{ text:`<p>The post reads like a memo that wandered outside without a coat. Four likes. One is your mother. One is a bot selling engagement services, which feels less like spam and more like commentary.</p>`, fx:{f:2,s:-4} } },
    { label:"Pitch something playful. A little game, maybe. Legal humour — what could go wrong?", tag:"SOCIAL · DC 14", dc:14, kind:"soc",
      succ:{ text:`<p>Two partners hesitate. The third — the compliance partner, of all people — chuckles. <em>Audibly.</em> She approves it on the spot, initialling the draft with the flourish of a woman who has waited years for something worth initialling. The post goes out on Friday and does numbers the firm's deal announcements can only dream of. Marketing begins to look at you the way a dragon looks at gold.</p>`, fx:{f:14,s:-2,flag:"viral"} },
      fail:{ text:`<p>The draft is <em>"parked for later consideration."</em> You know what that means. Everyone knows what that means. There is a folder where drafts go to be considered later. Nothing has ever left it.</p>`, fx:{f:-4,s:-4} } },
    { label:"Ask the AI to draft it. What year is it, after all.",
      tag:"PERCEPTION · DC 12", dc:12, kind:"per",
      succ:{ text:`<p>The draft is good — suspiciously good — and cites, with total confidence, <em>Dragonhoard Ventures v. The Kingdom of Adverse Inference</em>. You catch it. The case does not exist. Or rather: it exists, but not in any reporter the machine should know about. You fix it, post it, and tell no one how close it was.</p>`, fx:{f:6,s:2} },
      fail:{ text:`<p>The post cites a case that does not exist. Know-How notices within four minutes — Know-How always notices — and the retraction is handled "discreetly", which is to say everyone knows by lunch.</p>`, fx:{f:-10,s:-4} } },
  ]},

{ day:"WEDNESDAY", time:"10:00", title:"The Call That Could Have Been an Email",
  text:`<p>All-hands. Ninety minutes. Agenda item 7: <em>"synergies."</em> Agenda item 8 is a discussion of agenda item 7.</p>`,
  choices:[
    { label:"Camera on. Nod at strategic intervals.", tag:"ENDURANCE · DC 11", dc:11, kind:"end",
      succ:{ text:`<p>You deploy the full repertoire: the slow nod, the thoughtful frown, the note taken at nothing in particular. The managing partner later describes you as <em>"engaged."</em> You were composing a grocery list. The two are not mutually exclusive.</p>`, fx:{f:6,s:-6} },
      fail:{ text:`<p>You nod, gravely and visibly, at the precise moment the fourth-floor printer's decommissioning is announced. Your nod is now on record as the meeting's sole expression of support for this decision. The printer's allies will remember.</p>`, fx:{f:2,s:-10} } },
    { label:"Camera off. Document review in parallel. Efficiency.", tag:"PERCEPTION · DC 13", dc:13, kind:"per",
      succ:{ text:`<p>Forty documents reviewed, one call survived, and when your name is suddenly called you produce — from pure spinal reflex — <em>"fully aligned with what was just said."</em> Nobody remembers what was just said. You are safe. This is how legends are not made, and careers are.</p>`, fx:{h:3.5,s:-2} },
      fail:{ text:`<p><em>"You're on mute. — Still on mute. — Can someone — hello?"</em> By the time you unmute, the question has moved on and taken your dignity with it as a courtesy.</p>`, fx:{f:-8,s:-6} } },
    { label:"Actually listen. Take real notes. Someone should know what was decided.",
      auto:{ text:`<p>You emerge with two pages of notes and the disquieting realisation that you are now the only person in the firm who knows what was agreed. This is either power or a burden. In law firms, the difference has never been established.</p>`, fx:{f:4,s:-8,flag:"notes"} } },
  ]},

{ day:"WEDNESDAY", time:"17:45", title:"The Timesheet Reckoning",
  text:`<p>Six unaccounted hours from Monday glare at you from the billing system. The system wants narratives. The system always wants narratives.</p>
        <p><em>What did you do between two and eight?</em> You know what you did. The challenge is making it sound like law.</p>`,
  choices:[
    { label:"Craft the narratives. Precision is a form of poetry.", tag:"DRAFTING · DC 12", dc:12, kind:"dra",
      succ:{ text:`<p><em>"0.5 — analysis of interplay between clauses 14.2 and 22.1."</em> It was staring. But it was <em>analytical</em> staring, and by the end of it you understood the interplay, so the narrative is — you check your conscience; your conscience shrugs — accurate.</p>`, fx:{h:4,f:4} },
      fail:{ text:`<p>At entry four your prose collapses and you write <em>"0.3 — pondering."</em> The billing partner calls within the hour. He does not say hello. He says, <em>"Pondering."</em></p>`, fx:{f:-8,s:-4} } },
    { label:"Write it exactly as it happened. Honesty is a virtue.",
      auto:{ text:`<p><em>"1.2 — waiting for partner comments."</em> It is true. It is defensible. It is also, you are gently informed, <em>"not a billing narrative but a cry for help,"</em> and it is revised by persons unknown before it reaches the client.</p>`, fx:{s:6,f:-4} } },
    { label:"Forensic reconstruction from your own sent items.", tag:"ENDURANCE · DC 11", dc:11, kind:"end",
      succ:{ text:`<p>Your sent folder is a diary written by a stranger with your name. But it is <em>evidence</em>, and from it you rebuild Monday with the rigour of an expert report. Six hours, recovered. The timesheet closes with a click that sounds, faintly, like absolution.</p>`, fx:{h:5,s:-6} },
      fail:{ text:`<p>The reconstruction reveals a forty-minute gap that no email, calendar entry or memory can explain. You stare into the gap. The gap stares back. You bill it as "file organisation" and agree with yourself never to speak of it again.</p>`, fx:{h:3,s:-8} } },
  ]},

{ day:"THURSDAY", time:"12:30", title:"The Client Lunch",
  text:`<p>Von Precedent brings you to lunch with the client's general counsel. Your briefing, delivered in the lift: <em>"Say something clever. But not before the main course."</em></p>`,
  choices:[
    { label:"Wait for the opening. Deploy the clever thing.", tag:"SOCIAL · DC 13", dc:13, kind:"soc",
      succ:{ text:`<p>Between main course and coffee, a gap opens in the conversation and you place into it one observation — brief, useful, lightly funny. The GC laughs, then asks for your card. You have cards? You have cards. Von Precedent watches this the way a dragon watches its hoard appreciate.</p>`, fx:{f:12,flag:"client"} },
      fail:{ text:`<p>Nerves. You explain limitation periods for eleven minutes. The GC's eyes do not glaze — general counsel are trained beyond glazing — but the dessert menu is consulted with unusual devotion.</p>`, fx:{f:-6,s:-4} } },
    { label:"Listen strategically. Speak once, and make it count.", tag:"PERCEPTION · DC 11", dc:11, kind:"per",
      succ:{ text:`<p>You say one sentence the entire lunch. It is the right sentence. On the walk back, von Precedent says, <em>"Good."</em> One syllable. From him, a eulogy.</p>`, fx:{f:8} },
      fail:{ text:`<p>You wait so carefully for the perfect moment that the lunch ends without you in it. You were present the way furniture is present: appreciated, in principle, by nobody in particular.</p>`, fx:{f:2,s:-2} } },
    { label:"Nod. Eat. Survive. Ambition is for people who slept.",
      auto:{ text:`<p>The bread is excellent. You contribute two nods and one accurate laugh. Nothing is won; nothing is lost; the burrata was, in every reviewable respect, correct.</p>`, fx:{f:2,s:2} } },
  ]},

{ day:"THURSDAY", time:"23:40", title:"The Night Office",
  text:`<p>The turn of documents is due at nine. The floor is dark except for your desk and, far off, the vending machine's small blue vigil. The coffee machine displays <span class="mono">ERROR&nbsp;8</span> — it has run out of a substance it declines to name.</p>`,
  choices:[
    { label:"Push through. The documents will not turn themselves.", tag:"ENDURANCE · DC 13 · NIGHT", dc:13, kind:"end", night:true,
      succ:{ text:`<p>Somewhere past one, you enter the state veterans speak of: the words assemble themselves and you merely supervise. The turn goes out at 02:55, clean. You leave a building that hums to itself like something dreaming.</p>`, fx:{h:7,s:-10,night:true} },
      fail:{ text:`<p>The turn goes out at 03:40, complete and correct — except the covering email, which opens, in your own typeface, with the words <em>"Dear Clause,"</em>. The client, mercifully, will find it funny. You will find out that they found it funny from three separate partners.</p>`, fx:{h:7,s:-16,night:true} } },
    { label:"Follow the sound of humming. Frau Hilde is on this floor tonight.", tag:"PERCEPTION · DC 10", dc:10, kind:"per",
      succ:{ text:`<p>Frau Hilde, night custodian and — the juniors agree — the only person here with actual seniority, unlocks the <em>good</em> machine on the fourth floor. On the way back, there is a door in the corridor where, you are almost certain, there was wall this morning. Frau Hilde follows your gaze. <em>"Ah,"</em> she says. <em>"It shows itself when somebody truly needs it. Tonight, apparently, that is you."</em></p>
             <p>Inside: a bar of serious mahogany, low light, and a poker table at which three partners sit in shirtsleeves — von Precedent, the billing partner, and the compliance partner, who is, on the evidence of the chips in front of her, winning comfortably. Von Precedent looks up, entirely unsurprised. <em>"Sit. House rules: nothing played here is billed, minuted, or mentioned before nine."</em> The billing partner deals. He stacks his chips, you notice, in neat increments of 0.1.</p>
             <p class="aside">Above the bar, framed like a hunting trophy, hangs a memo dated 1989 — the junior work of one A. von Precedent, drowned in a senior partner's red ink, a single annotation legible across the room: <em>"Pondering is not a narrative, Aldric."</em> The partners frame their worst feedback. This explains a great deal.</p>`, fx:{s:10,h:4,flag:"lounge"} },
      fail:{ text:`<p>Frau Hilde has gone home — even legends have shift plans. But someone has left half a pot of filter coffee in the small kitchen, still warm, like a message from a kinder timeline. You drink it. You return. You endure.</p>`, fx:{s:4,h:4} } },
    { label:"Go home. Set the alarm for five. Finish with a functioning brain.",
      auto:{ text:`<p>Your bed and your alarm clock meet like opposing counsel: briefly, and without warmth. But the 05:00 version of you is sharper than the 03:00 version would have been, and the turn goes out at 08:52 with eight minutes of pure, insolent margin.</p>`, fx:{s:4,h:5} } },
  ]},

{ day:"FRIDAY", time:"10:15", title:"The Scribbles",
  text:`<p>Your draft returns from von Precedent's desk bearing his handwritten annotations: runes of an elder script, marginalia that curve around the page like ivy, and one long arrow pointing, with great conviction, at nothing.</p>`,
  choices:[
    { label:"Decipher the runes. You have trained for this.", tag:"PERCEPTION · DC 13", dc:13, kind:"per",
      succ:{ text:`<p>Line by line, it yields. All but one word, which is either <em>"delete"</em> or <em>"stet"</em>. It has always been either "delete" or "stet". Scholars of the von Precedent hand believe the ambiguity is intentional; a test; possibly a joke told over decades. You choose "stet". You choose correctly.</p>`, fx:{h:2.5,f:8} },
      fail:{ text:`<p>You misread the arrow. The paragraph it defended — the one he <em>liked</em> — is gone from the next version, and its absence is noticed the way a missing load-bearing wall is noticed.</p>`, fx:{f:-8,s:-4} } },
    { label:"Ask him directly. Radical, but legal.", tag:"SOCIAL · DC 12", dc:12, kind:"soc",
      succ:{ text:`<p>He is <em>delighted</em>. Nobody ever asks. He explains the annotations for forty minutes, including the arrow (it points, it turns out, at an idea). You leave with perfect clarity, a mild headache, and the strange warmth of a partner who has been listened to.</p>`, fx:{f:10,s:-4} },
      fail:{ text:`<p><em>"It's perfectly legible,"</em> he says, holding the page at the angle at which, presumably, it is. The conversation is over. The runes remain. You will guess, as your ancestors guessed.</p>`, fx:{f:-4,s:-4} } },
    { label:"Take it to Sera. Sera reads Aldric fluently.",
      auto:{ text:`<p>Sera glances at the page for four seconds. <em>"Delete, stet, move to clause 9, and the arrow means he wants a footnote but won't say so."</em> Sera should teach a seminar. Sera, you suspect, <em>is</em> the seminar.</p>`, fx:{f:4,h:2.5} } },
  ]},

{ day:"FRIDAY", time:"17:55", title:"The Before-the-Weekend Email", finale:true,
  text:`<p>It arrives at 17:55, as prophesied. Subject: <em>"Before the weekend — quick memo?"</em></p>
        <p>The client would love a short memo on a <em>"conceptually interesting point."</em> Monday, nine o'clock. <em>"Nothing fancy."</em> In the lore of this firm, no phrase has consumed more weekends than <em>nothing fancy</em>.</p>`,
  choices:[
    { label:"Accept. The weekend was only ever a rumour.", tag:"ENDURANCE · DC 12", dc:12, kind:"end",
      succ:{ text:`<p>Saturday morning, quiet office, decent coffee, and — you would admit this to no one — the point <em>is</em> conceptually interesting. The memo lands Sunday evening, eight pages, none of them fancy, all of them good.</p>`, fx:{h:8,f:10,s:-12} },
      fail:{ text:`<p>The memo lands Sunday at 23:47, complete, correct, and written by someone you no longer entirely are. Monday-you will read it with respect and mild fear.</p>`, fx:{h:8,f:6,s:-18} } },
    { label:"Cast the Counterspell: \"Happy to — shall we confirm scope and budget with the client first?\"", tag:"SOCIAL · DC 15", dc:15, kind:"soc", bonusFlags:["notes","client"],
      succ:{ text:`<p>Silence. Then, at 18:20, the client replies directly: <em>"Wednesday is fine. Enjoy the weekend."</em> Von Precedent forwards it without comment, which is his language for applause. You have cast the highest-level spell in the associate grimoire, and it <em>held</em>.</p>`, fx:{f:12,s:10} },
      fail:{ text:`<p><em>"I'll take that as a yes,"</em> he replies, at 17:58, from what is evidently a phone, a car, and a parallel moral universe. The weekend proceeds as originally prophesied.</p>`, fx:{h:6,f:4,s:-10} } },
    { label:"— ", tag:"", dynamic:true },
  ]},
];

/* dynamic third finale option */
function finaleThird(){
  if(S.flags.sera){
    return { label:"Forward it to no one — but Sera has already seen it. Sera sees everything.",
      auto:{ text:`<p>A message from Sera at 17:59: <em>"I have a template."</em> Of course she does. You draft it together on Saturday morning in ninety focused minutes, and she takes the second read. The ledger of owed favours updates itself with a soft, contented sound.</p>`, fx:{h:4,f:6,s:2} } };
  }
  return { label:"Propose delivery by drafting Monday at 05:00. Sacrifice the dawn, save the weekend.",
    auto:{ text:`<p>You reply committing to Monday, 09:00 — and mean it, in the specific sense of an alarm set for 04:45. The weekend is saved the way a besieged city is saved: technically, and at cost.</p>`, fx:{h:5,f:4,s:-6} } };
}

--------------------------------------------------------------- */
function letterhead(){
  return `<div class="letterhead">
    <div class="firm">Wyrm &amp; Grimoire LLP</div>
    <div class="firm-sub">A Magic Circle Firm · Est. Time Immemorial</div>
  </div>`;
}

function hud(scene){
  const sLow = S.sanity<30, fLow = S.favor<30;
  return `<div class="hud">
    <div class="meter"><div class="lab"><span>Sanity</span><span>${S.sanity}</span></div>
      <div class="bar sanity ${sLow?"low":""}"><i style="width:${S.sanity}%"></i></div></div>
    <div class="meter"><div class="lab"><span>Partner Favor</span><span>${S.favor}</span></div>
      <div class="bar ${fLow?"low":""}"><i style="width:${S.favor}%"></i></div></div>
    <div class="ledger"><div class="lab"><span>Billable</span><span>target 50.0</span></div>
      <div class="tally"><span>recorded</span><span>${S.hours.toFixed(1)} h</span></div></div>
    <div class="daytag">${scene? scene.day+" · "+scene.time : ""} · ${S.cls.name.toUpperCase()}</div>
  </div>`;
}

function showClasses(){
  app.innerHTML = `
    ${letterhead()}
    <div class="stampline">HR ONBOARDING · FORM 1 OF 1 · CHOOSE YOUR CLASS</div>
    <h2 class="scene-title">Who reports for duty on Monday?</h2>
    <div class="classes">
      ${CLASSES.map((c,i)=>`
        <button onclick="pick(${i})">
          <b>${c.name}</b> — <span class="aside">${c.oath}</span><br>
          ${c.desc}
          <span class="tag">${c.mech}</span>
        </button>`).join("")}
    </div>`;
  window.scrollTo(0,0);
}

function pick(i){ S = newState(CLASSES[i]); showScene(); }

function showScene(){
  if(S.sanity<=0) return showEnding(earlySanity());
  if(S.favor<=0)  return showEnding(earlyFavor());
  if(S.i>=SCENES.length) return showEnding(finalEnding());

  const sc = SCENES[S.i];
  const choices = sc.choices.map(c=> c.dynamic ? finaleThird() : c);

  app.innerHTML = `
    ${letterhead()}
    ${hud(sc)}
    <div class="stampline">${sc.day} · ${sc.time} · ENCOUNTER ${S.i+1} OF ${SCENES.length}</div>
    <h2 class="scene-title">${sc.title}</h2>
    <div class="scene-text">${sc.text}</div>
    <div class="choices">
      ${choices.map((c,j)=>`
        <button onclick="choose(${j})">${c.label}${c.tag?`<span class="tag">${c.tag}</span>`:""}</button>`).join("")}
    </div>`;
  window.scrollTo(0,0);
}

function choose(j){
  const sc = SCENES[S.i];
  const c0 = sc.choices[j];
  const c  = c0.dynamic ? finaleThird() : c0;
  let html = "";

  if(c.auto){
    const fx = applyFx(c.auto.fx||{});
    html = `<div class="outcome">${c.auto.text}</div>
            ${fx?`<div class="fx-line">LEDGER ENTRY · ${fx}</div>`:""}`;
  } else {
    const roll = d20();
    let mod = (S.cls.mods[c.kind]||0);
    if(c.night) mod += (S.cls.mods.night||0);
    if(c.bonusFlags) c.bonusFlags.forEach(f=>{ if(S.flags[f]) mod+=1; });
    const total = roll+mod;
    const crit = roll===20, fumble = roll===1;
    const ok = !fumble && (crit || total>=c.dc);
    const branch = ok ? c.succ : c.fail;
    const fx = applyFx(Object.assign({}, branch.fx, c.night?{night:true}:{}));

    html = `
      <div class="roll-stamp">
        d20 &rarr; <b>${roll}</b>${mod?` ${mod>0?"+":""}${mod}`:""} = ${total} · DC ${c.dc}<br>
        ${crit?"NATURAL 20 · EXEMPLARY":fumble?"NATURAL 1 · SEE ME":ok?"APPROVED":"DENIED"}
      </div>
      <div class="outcome">${branch.text}
      ${crit?`<p class="aside">A natural twenty. Somewhere, a filing system aligns itself in your honour.</p>`:""}
      ${fumble?`<p class="aside">A natural one. The universe initials the margin: <em>we need to talk.</em></p>`:""}</div>
      ${fx?`<div class="fx-line">LEDGER ENTRY · ${fx}</div>`:""}`;
    if(crit && branch===c.succ){ S.favor=clamp(S.favor+3,0,100); }
    if(fumble){ S.sanity=clamp(S.sanity-3,0,100); S.favor=clamp(S.favor-4,0,100); }
  }

  const sc2 = SCENES[S.i];
  app.innerHTML = `
    ${letterhead()}
    ${hud(sc2)}
    <div class="stampline">${sc2.day} · ${sc2.time} · ${sc2.title.toUpperCase()} · RESOLUTION</div>
    ${html}
    <button class="continue" onclick="S.i++;showScene()">CONTINUE</button>`;
  window.scrollTo(0,0);
}

   ENDINGS
--------------------------------------------------------------- */
function earlySanity(){
  return { title:"Out of Office",
    text:`<p>Somewhere between one urgent thing and the next, you close the laptop. Not dramatically — laptops deserve better — just: closed.</p>
          <p>You set an out-of-office reply, the legendary artifact the elders spoke of, and the world, to your genuine surprise, does not end. Sera covers the file. The partners manage. The building hums on without you, and hums no worse.</p>
          <p>You come back the following Tuesday with actual sleep behind you and a small plant, which you place on the desk as a treaty. The work is still there. So, it turns out, are you — and the trick, the veterans say, is making sure it stays in that order.</p>` };
}
function earlyFavor(){
  return { title:"The Knowledge Management Guild",
    text:`<p>The conversation is called a "development conversation", which is accurate the way "restructuring" is accurate. You are reassigned, for a season, to the Knowledge Management Guild.</p>
          <p>And here is the thing nobody tells you: the deadlines are self-imposed, the templates are yours to rule, and the coffee is better. <em>Suspiciously</em> better. Six months from now, an associate in crisis will knock on your door at midnight, and you will look at their problem and say, with the calm of the converted: <em>"I have a template."</em></p>
          <p>Every Sera was forged somewhere.</p>` };
}
function finalEnding(){
  const {hours,favor,sanity}=S, f=S.flags;
  if(f.lounge && sanity>=40 && favor>=45) return { title:"The Partners' Lounge",
    text:`<p>You look for the door on Friday. Wall. You look again on Monday, casually, twice. Wall. The lounge, it turns out, is not a place one finds. It is a place that finds you.</p>
          <p>Months later — after your first truly lost deal, the kind that follows you into the lift — the door is simply there again. Inside, von Precedent slides a stack of chips across the table without a word, and you finally understand what the room is for. It does not open for winners. It opens for <em>need.</em> The partners did not build themselves a bar; they built a place to catch each other. Tonight it has decided you are worth catching.</p>
          <p>You play until one. You lose, gracefully, to the billing partner, who counts his winnings in six-minute units. Above the bar, 1989 keeps watch in its frame. Everyone in this firm was red ink once. The good ones keep the door in working order.</p>` };
  if(hours>=50) return { title:"The 2200 Club",
    text:`<p>${hours.toFixed(1)} hours. Billed. In one week. Annualised, the number crosses 2,200, at which point the billing system produces an alert nobody knew it could produce, and a partner from the firm's New York alliance sends a one-line email: <em>"Solid week. What's your usual?"</em></p>
          <p>For one Monday you are a legend. Billing prints your timesheet and pins it to a corkboard that did not exist on Friday. Von Precedent says nothing, which from him is a parade.</p>
          <p>Frau Hilde, unasked, leaves a second coffee on your desk. Legends, she knows from long observation, are the ones who need watching. The record stands — and records, please note, are things one <em>sets down.</em> Next week is allowed to be ordinary. Even in New York, the good ones make sure it sometimes is.</p>` };
  if(hours>=34 && favor>=75 && sanity>=45) return { title:"The Partner Track",
    text:`<p>Monday morning, von Precedent passes your office, stops, and looks in. <em>"Good week,"</em> he says.</p>
          <p>That is all. That is the entire reward. Two words, unwitnessed, unbillable — and you will run on them for a month, which both of you know, which is precisely why they are rationed.</p>
          <p>Your name comes up, later that day, in a meeting you are not in. It is said in a promising tone. In this business, that is how futures begin: quietly, in rooms you haven't entered yet.</p>` };
  if(f.viral && favor>=60) return { title:"Head of Thought Leadership",
    text:`<p>Your post has, by Monday, outperformed every deal announcement the firm published this year, a fact Marketing recites at intervals like a psalm. A partner from the Munich office you have never met sends you a connection request with the note <em>"finally."</em></p>
          <p>Ms. Melodia now introduces you as <em>"our secret weapon,"</em> which is alarming, because secret weapons get deployed. There is talk of a series. There is talk of a <em>format</em>. You wanted to be a lawyer; you may accidentally have become a channel.</p>
          <p>You decide you can be both. History suggests you may even be right.</p>` };
  if(f.client && favor>=65 && sanity>=50) return { title:"The Client Whisperer",
    text:`<p>Tuesday, the general counsel emails you. Not the partner — <em>you</em>. A small question, carefully addressed, with von Precedent merely in copy, like a chaperone at a dance that has plainly moved beyond him.</p>
          <p>He forwards it to you with one line: <em>"Handle."</em> In the economy of partners, this is a knighthood.</p>
          <p>Ten years from now you will either make partner or go in-house with this client, and the remarkable thing — the thing nobody warns you about — is that both of those emails have, in some sense, already been drafted. All you have to do is keep answering the small questions well.</p>` };
  if(hours>=42 && sanity<45) return { title:"The Machine",
    text:`<p>${hours.toFixed(1)} hours. The timesheet is a thing of terrible beauty — narratives crisp, increments immaculate, not one tenth astray. Billing prints it out. Billing has never printed one out before.</p>
          <p>Nobody, however, has seen you eat since Wednesday, and the plant on your windowsill has begun to look at you with concern, which is troubling in a plant.</p>
          <p>You are magnificent and you are running on fumes, and the firm will happily accept both for as long as you offer them. The offering, please note, is the part you control. Next week, try controlling it.</p>` };
  if(sanity>=65 && hours<34) return { title:"The Sustainable One",
    text:`<p>You billed thirty-something hours, left twice before eight, and spent Friday evening in the company of people who have never heard of clause 14.2 and are happier for it.</p>
          <p>The partners find you faintly puzzling, the way one is puzzled by a colleague who visibly sleeps. But your drafts are clean, your judgment is rested, and the clients — the clients keep asking for you, with the instinct clients have for lawyers who will still be practising in twenty years.</p>
          <p>It is the long game. Nobody here will tell you that you're winning it. You are, though.</p>` };
  return { title:"An Ordinary Week",
    text:`<p>Nothing legendary happened. You billed what you billed, dodged what could be dodged, and kept most of your sanity in the original packaging. The SPA closed. The memo landed. The printer on the fourth floor continues to be monitored.</p>
          <p>On Sunday evening the small dread arrives, punctual as ever — and underneath it, quieter, something you would deny under oath: you're a little curious what Monday brings.</p>
          <p>The dungeon resets weekly. The party, somehow, keeps showing up. That is either the joke or the whole point, and after this week you suspect it is both.</p>` };
}

function showEnding(e){
  app.innerHTML = `
    ${letterhead()}
    <div style="text-align:center;margin-top:6px">
      <div class="end-stamp">FILE CLOSED</div>
      <div class="end-title">${e.title}</div>
    </div>
    <div class="scene-text">${e.text}</div>
    <div class="end-stats">
      Class · ${S.cls.name} &nbsp;·&nbsp; Billable · ${S.hours.toFixed(1)} / 50.0*<br>
      Partner Favor · ${S.favor} / 100 &nbsp;·&nbsp; Sanity · ${S.sanity} / 100<br>
      *target: achievable — the Sanity column shows the exchange rate
    </div>
    <button class="continue" onclick="showTitle()">ROLL AGAIN NEXT MONDAY</button>
    <div class="footer-note">Wyrm &amp; Grimoire LLP · A Trivial Comedy for Serious People, Continued</div>`;
  window.scrollTo(0,0);
}
