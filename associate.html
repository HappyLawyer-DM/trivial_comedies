<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASSOCIATE — A Seven-Year Career RPG</title>
<style>
:root{--paper:#F7F5EF;--paper2:#EFEADF;--ink:#1D1B16;--soft:#5A554B;--red:#A52A22;--green:#123F2E;--gold:#8A6D2F;--rule:#C9C2B0;--mono:"Courier New",monospace;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box} body{margin:0;background:var(--paper2);color:var(--ink);font-family:var(--mono)}
.shell{max-width:980px;margin:0 auto;background:var(--paper);min-height:100vh;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
header{padding:28px 28px 20px;text-align:center;border-bottom:3px double var(--ink)}
h1{font-family:var(--serif);font-weight:normal;letter-spacing:.07em;margin:4px 0 6px}.sub{font-family:var(--serif);font-style:italic;color:var(--soft)}
.layout{display:grid;grid-template-columns:300px 1fr;gap:0}.sheet{border-right:1px solid var(--rule);padding:20px;position:sticky;top:0;height:100vh;overflow:auto;background:#f3f0e7}.game{padding:26px 30px 70px;min-height:100vh}
.sheet h2,.sheet h3{font-family:var(--serif);font-weight:normal;margin:0 0 12px}.lvl{font-size:12px;letter-spacing:.15em;color:var(--soft);margin-bottom:18px}.stat{display:grid;grid-template-columns:1fr 42px;gap:8px;padding:6px 0;border-bottom:1px dotted var(--rule)}.stat b{text-align:right}.meter{margin:12px 0}.meter .lab{font-size:11px;letter-spacing:.1em;color:var(--soft)}.bar{font-size:12px;letter-spacing:0;white-space:nowrap}.skill{font-size:12px;line-height:1.8}.locked{opacity:.45}.section{margin:26px 0 10px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);display:flex;gap:12px;align-items:center}.section:after{content:"";flex:1;border-top:1px solid var(--rule)}
.narr{font-family:var(--serif);font-size:18px;line-height:1.72;margin:14px 0}.tx{font-size:13.5px;line-height:1.75;white-space:pre-wrap}.choices{margin:22px 0}.choice{display:block;width:100%;text-align:left;background:none;border:1px solid var(--rule);border-left:4px solid var(--green);padding:13px 15px;margin:10px 0;cursor:pointer;font:13.5px/1.55 var(--mono);color:var(--ink)}.choice:hover:not(:disabled){background:#fff;border-left-color:var(--red)}.choice:disabled{opacity:.45;cursor:not-allowed}.tag{display:block;margin-top:5px;font-size:11px;color:var(--soft);letter-spacing:.08em;text-transform:uppercase}.result{border-left:3px solid var(--gold);padding:12px 14px;margin:18px 0;background:rgba(138,109,47,.07);line-height:1.65}.result.bad{border-color:var(--red);background:rgba(165,42,34,.06)}.result .delta{margin-top:9px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}.die{display:inline-block;border:3px solid var(--red);color:var(--red);padding:8px 14px;margin:15px 0;transform:rotate(-4deg);font-weight:bold}.die .big{display:block;font-size:30px;text-align:center}.die .small{font-size:10px;letter-spacing:.12em}.cont{display:block;margin:20px auto;background:var(--green);color:#eee8d8;border:0;padding:11px 22px;cursor:pointer;font:12px var(--mono);letter-spacing:.14em}.review{border:1px solid var(--rule);padding:14px 16px;margin:18px 0;background:#fff}.pill{display:inline-block;border:1px solid var(--rule);padding:3px 7px;margin:2px 3px 2px 0;font-size:11px}

.cover-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0c0c0c;padding:24px}.cover-card{max-width:760px;width:100%;text-align:center}.cover-card img{display:block;width:100%;height:auto;border:1px solid #6f5a2b;box-shadow:0 10px 40px rgba(0,0,0,.45)}.start-btn{margin:22px auto 0;background:var(--green);color:#eee8d8;border:1px solid var(--gold);padding:13px 28px;cursor:pointer;font:12px var(--mono);letter-spacing:.16em}.start-btn:hover{background:#0B2E21}.hidden{display:none!important}
@media(max-width:760px){.layout{grid-template-columns:1fr}.sheet{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--rule)}.game{padding:22px 18px 60px}}

.restart-global{
  position:fixed; right:18px; bottom:18px; z-index:100;
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  background:var(--paper); color:var(--ink); border:1px solid var(--ink);
  padding:9px 13px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.12);
}
.restart-global:hover{background:var(--ink);color:var(--paper);}

</style>
</head>

<script>
"use strict";
const app=document.getElementById('app'), sheet=document.getElementById('sheet');
const INITIAL_STATE={name:'',year:1,level:1,cls:null,subclass:null,xp:0,rep:0,energy:10,life:10,bill:0,internal:0,client:0,clientNetwork:0,sponsor:0,business:0,attrs:{craft:0,judgment:0,grit:0,presence:0,instinct:0,drive:0},skills:{},feats:[],flags:{internalUnlocked:false,clientUnlocked:false,clientNetwork:false,sponsor:false,business:false,alex:false,yaa:0,article:false,pub:0,sigY3:false,sigY4:false,sigY5:false,sigY6:false},scene:'classSelect'};
let S=JSON.parse(JSON.stringify(INITIAL_STATE));
function resetGame(){S=JSON.parse(JSON.stringify(INITIAL_STATE));app.innerHTML='';paintSheet();go('classSelect');window.scrollTo({top:0,behavior:'smooth'});}
const labels={craft:'CRAFT',judgment:'JUDGMENT',grit:'GRIT',presence:'PRESENCE',instinct:'INSTINCT',drive:'DRIVE'};
function meter(v,max=10){let n=Math.max(0,Math.min(10,Math.round(v/max*10)));return '█'.repeat(n)+'░'.repeat(10-n)+' '+v+'/'+max}
function paintSheet(){const who=S.cls?(S.cls.toUpperCase()+(S.subclass?' · '+S.subclass.toUpperCase():'')):'UNASSIGNED';sheet.innerHTML=`<h2>CHARACTER SHEET</h2>${S.name?`<div class="lvl" style="letter-spacing:.18em">${S.name.toUpperCase()}</div>`:''}<div class="lvl">LEVEL ${S.level} · YEAR ${S.year} · ${who}</div>${Object.entries(S.attrs).map(([k,v])=>`<div class="stat"><span>${labels[k]}</span><b>${v>=0?'+':''}${v}</b></div>`).join('')}<div class="meter"><div class="lab">XP</div><div class="bar">${S.xp}</div></div><div class="meter"><div class="lab">REPUTATION</div><div class="bar">${meter(S.rep,10)}</div></div><div class="meter"><div class="lab">ENERGY${S.energy<=1?' <span style="color:var(--red)">· EXHAUSTED</span>':''}</div><div class="bar">${meter(S.energy)}</div></div><div class="meter"><div class="lab">LIFE</div><div class="bar">${meter(S.life)}</div></div><div class="meter"><div class="lab">BILLABLES · EXPECTATION 6</div><div class="bar">${meter(S.bill,6)}</div></div>${S.flags.internalUnlocked?`<div class="meter"><div class="lab">INTERNAL CAPITAL</div><div class="bar">${meter(S.internal)}</div></div>`:'<div class="skill locked">🔒 Internal Capital</div>'}${S.flags.clientUnlocked?`<div class="meter"><div class="lab">CLIENT TRUST</div><div class="bar">${meter(S.client)}</div></div>`:'<div class="skill locked">🔒 Client Trust</div>'}<h3 style="margin-top:20px">SKILLS &amp; FEATS</h3><div class="skill">${Object.entries(S.skills).length?Object.entries(S.skills).map(([k,v])=>`<span class="pill">${k} +${v}</span>`).join(''):'<span class="locked">No skills yet</span>'}<br>${S.feats.length?S.feats.map(f=>`<span class="pill">${f}</span>`).join(' '):''}</div><h3 style="margin-top:20px">CAREER CAPITAL</h3><div class="skill">${S.flags.clientNetwork?`Client Network: ${S.clientNetwork}/10`:'<span class="locked">🔒 Client Network</span>'}<br>${S.flags.sponsor?`Sponsorship: ${S.sponsor}/10`:'<span class="locked">🔒 Sponsorship</span>'}<br>${S.flags.business?`Business Case: ${S.business}/10`:'<span class="locked">🔒 Business Case</span>'}</div>`}
function awardFeat(n){if(!S.feats.includes(n)){S.feats.push(n);app.insertAdjacentHTML('beforeend',`<div class="result">✦ FEAT UNLOCKED — ${n}</div>`);paintSheet()}}
function clear(){app.innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
function sec(t){app.insertAdjacentHTML('beforeend',`<div class="section">${t}</div>`)}

 {label:`A — THE ALL-NIGHTER\nTake ownership personally. Research and draft the submission yourself overnight.`,tag:'GRIT',dc:13,mod:S.attrs.grit,success:{text:'You get it done. The work is good. You are also running on fumes.',d:{xp:3,rep:2,energy:-3,life:-1}},fail:{text:'At 03:40 the draft is still moving sideways. Responsibility without leverage turns into exhaustion.',d:{xp:1,energy:-3,life:-1}},next:'train2'},
 {label:`B — BUILD THE TEAM\nGive the junior the research questions, set a structure, draft the key sections yourself and integrate later.`,tag:'JUDGMENT',dc:13,mod:S.attrs.judgment+1,success:{text:'The division of labour works. The junior returns usable research; you keep control of the argument without doing every task yourself.',d:{xp:3,rep:2,energy:-1,internal:1}},fail:{text:'The hand-off is too loose. You spend much of the night repairing the work you delegated.',d:{xp:2,energy:-2}},next:'train2'},
 {label:`C — TAKE COMMAND\nCall the partner, agree the three propositions the submission must establish, then run the team accordingly.`,tag:'PRESENCE',dc:15,mod:S.attrs.presence,success:{text:'The call lasts seven minutes. The scope is fixed. The team knows what good looks like. You have begun to manage upward as well as downward.',d:{xp:3,rep:2,internal:1,energy:-1}},fail:{text:'The partner hears uncertainty where you intended discipline. You still have the deadline, but less room to manoeuvre.',d:{xp:1,energy:-2}},next:'train2'},
 {label:`D — ASK FOR TIME\nRecommend requesting a short extension from the tribunal.`,tag:'JUDGMENT',dc:14,mod:S.attrs.judgment,success:{text:'The request is accepted as sensible case management. You have bought the team time without looking weak.',d:{xp:3,rep:1}},fail:{text:'The partner declines. You have lost twenty minutes and still have the same deadline.',d:{energy:-1}},next:'train2'}])},
 review2(){sec('YEAR II · ANNUAL REVIEW');narr('Can people rely on you?');tx(`The review focuses less on whether you can produce good work and more on whether work can safely be left with you.`);app.insertAdjacentHTML('beforeend',`<div class="review"><b>Current assessment</b><br><br>Technical development: improving<br>Client-facing confidence: strong<br>Delegation: emerging<br>Judgment: developing<br>Trajectory: consistent with expectations. Whose expectations is not specified.<br><br>Internal standing: ${S.internal}/10<br>Client Trust: ${S.client}/10<br>Life: ${S.life}/10</div>`);narr('You are promoted to Year III. A new part of the career becomes visible.');S.year=3;S.level=3;S.energy=Math.min(10,S.energy+2);S.flags.clientNetwork=true;S.clientNetwork=1;paintSheet();cont('subclassChoice')},
 y3a(){sec('YEAR III · THINK');narr('DO YOU UNDERSTAND THE CASE?');tx(`A witness interview has gone badly. The witness is confident. The emails are contemporaneous.\n\nThe partner asks what you think the team should do.`);choices([
 {label:`A — FIX THE WITNESS\nPrepare the witness intensively until the account is consistent.`,tag:'CRAFT',dc:14,mod:S.attrs.craft,success:{text:'You improve clarity, but the documentary tension remains visible. The team is prepared for it.',d:{xp:2,rep:1}},fail:{text:'The preparation becomes over-engineered. The witness sounds less natural, not more credible.',d:{rep:-1,energy:-1}},next:'y3b'},
 {label:`B — FIX THE CASE\nAccept the inconsistency, identify the proposition that can still safely be advanced, and adjust the theory.`,tag:'JUDGMENT',dc:14,mod:S.attrs.judgment,success:{text:'You preserve the credible part of the case instead of forcing the facts into the pleading.',d:{xp:3,rep:2}},fail:{text:'You narrow too aggressively and give away more than the evidence requires.',d:{xp:1}},next:'y3b'},
 {label:`C — TEST THE WITNESS\nAsk the difficult questions now, before opposing counsel does.`,tag:'INSTINCT',dc:13,mod:S.attrs.instinct,success:{text:'The witness admits what is uncertain and becomes more reliable because of it.',d:{xp:3,client:1}},fail:{text:'The conversation becomes defensive. You learn something useful, but at a cost.',d:{energy:-1}},next:'y3b'}])},
 y3b(){sec('YEAR III · ENCOUNTER');narr('THE FIRST CROSS-EXAMINATION');tx(`The senior associate offers you fifteen minutes of cross-examination on a narrow issue.\n\nIt is real. The tribunal is watching. So is the client.`);choices([
 {label:`A — TAKE IT\nPrepare tightly and conduct the cross yourself.`,tag:'PRESENCE',dc:15,mod:S.attrs.presence,success:{text:'You get the admission you need and stop. The client writes down your name.',d:{xp:4,rep:2,client:1,clientNetwork:1}},fail:{text:'The witness escapes twice. You recover, but learn that advocacy punishes one question too many.',d:{xp:2,energy:-1}},next:'y3assoc'},
 {label:`B — DECLINE\nAsk the senior associate to handle it and use the hearing to observe.`,out:{text:'Safe. Sensible. You learn a lot. Nobody learns whether you could have done it.',d:{xp:1}},next:'y3assoc'},
 {label:`C — CO-COUNSEL\nAsk to prepare the sequence and hand it over if the examination becomes difficult.`,tag:'JUDGMENT',dc:12,mod:S.attrs.judgment,success:{text:'The division works. You contribute substance and still take part in the hearing.',d:{xp:2,rep:1}},fail:{text:'The handover is awkward and costs momentum.',d:{xp:1}},next:'y3assoc'}])},
 y3assoc(){sec('YEAR III · JOIN');narr('THE YOUNG ASSOCIATION');tx(`The young arbitration practitioners' association is looking for committee members. The work is unpaid, the events are in the evening, and the members are, like you, too junior to send work to anyone.\n\nNobody is offered a conference in their first year. The first year is name badges.\n\nIn ten years, some of them will be general counsel.`);choices([
 {label:`A — VOLUNTEER FOR THE GRUNT WORK\nMinutes, name badges, room bookings. First-year members do not get the interesting jobs.`,out:{text:'You spend the autumn printing name badges and taking minutes. Nothing comes back yet. The committee learns the one thing about you that committees remember: you show up.',d:{energy:-1,life:-1,flags:{yaa:1}}},next:'pub3'},
 {label:`B — ATTEND, DO NOT VOLUNTEER\nGo to the dinners, skip the committee.`,out:{text:'The network grows politely, one business card at a time.',d:{clientNetwork:1}},next:'pub3'},
 {label:`C — DECLINE\nThe cases are here, not at a drinks reception.`,out:{text:'The evenings stay yours. Your peers join anyway. In ten years, some of them will be sending cases — to each other.',d:{energy:1,life:1}},next:'pub3'}])},
 y3boss(){sec('YEAR III · ORDEAL');narr('THE HEARING');tx(`Day four. Opposing counsel produces a document that appears to undermine your witness. The partner whispers:

“Can we deal with this?”

The partner's whisper is calm. The partner's handwriting is not.

You have ninety seconds.`);choices([
 {label:`A — FIND THE RECORD
Search the chronology and bundle for the surrounding documents.`,tag:'CRAFT',dc:15,mod:S.attrs.craft,success:{text:'You find the missing context. The document is damaging, but not fatal.',d:{xp:4,rep:2}},fail:{text:'The record is too large and the moment passes.',d:{energy:-1}},next:'train3'},
 {label:`B — READ THE ROOM
Work out what the tribunal actually seems concerned about and answer that point.`,tag:'INSTINCT',dc:15,mod:S.attrs.instinct,success:{text:'You identify the tribunal’s real concern and give the partner a usable answer.',d:{xp:4,rep:2,internal:1}},fail:{text:'You misread the concern and the partner has to improvise.',d:{rep:-1}},next:'train3'},
 {label:`C — REFRAME
Suggest conceding the narrow point and preserving the larger theory.`,tag:'JUDGMENT',dc:16,mod:S.attrs.judgment,success:{text:'The concession lands well. Credibility increases because the team does not overfight the record.',d:{xp:5,rep:2,client:1}},fail:{text:'The concession is broader than necessary. The team spends the evening repairing the position.',d:{energy:-2}},next:'train3'},
 {label:`⚔ ARBITRATION COUNSEL — PROCEDURAL INSTINCT
Check whether the document is actually in the evidentiary record and whether opposing counsel may use it this way.`,tag:'JUDGMENT',dc:13,mod:S.attrs.judgment,subclassOnly:'Arbitration Counsel',ability:'PROCEDURAL INSTINCT',signatureBonus:2,success:{text:'The document is real. The ambush is not. You identify the procedural limit and give the partner a precise objection rather than a speech.',d:{xp:5,rep:2,internal:1,flags:{sigY3:true}}},fail:{text:'The tribunal permits the use. You have bought ninety seconds and no more.',d:{xp:1}},next:'train3'},
 {label:`⚔ HEARING COUNSEL — ON YOUR FEET
Give the partner a three-question sequence that turns the document into the witness’s explanation rather than opposing counsel’s exhibit.`,tag:'PRESENCE',dc:13,mod:S.attrs.presence,subclassOnly:'Hearing Counsel',ability:'ON YOUR FEET',signatureBonus:2,success:{text:'Three questions. One answer. The document remains ugly, but it stops belonging to opposing counsel.',d:{xp:5,rep:2,client:1,flags:{sigY3:true}}},fail:{text:'The sequence is clever but one question too long. The witness begins explaining. Everyone regrets that.',d:{energy:-1}},next:'train3'},
 {label:`⚔ INVESTIGATIONS LAWYER — FOLLOW THE RECORD
Look at the email chain, metadata and chronology rather than the sentence opposing counsel is reading aloud.`,tag:'INSTINCT',dc:12,mod:S.attrs.instinct,subclassOnly:'Investigations Lawyer',ability:'FOLLOW THE RECORD',signatureBonus:2,success:{text:'The attachment predates the email by three weeks. The supposed contradiction is a recycled draft. The room changes temperature.',d:{xp:5,rep:2,client:1,flags:{sigY3:true}}},fail:{text:'The metadata is inconclusive. You learn why forensic confidence should arrive after the forensic work.',d:{xp:1}},next:'train3'},
 {label:`⚔ QUANTUM SPECIALIST — TEST THE MODEL
Ask whether the document changes the loss calculation at all.`,tag:'CRAFT',dc:12,mod:S.attrs.craft,subclassOnly:'Quantum Specialist',ability:'TEST THE MODEL',signatureBonus:2,success:{text:'It hurts the narrative and moves the damages model by less than one per cent. You hand the partner the number that puts the document in proportion.',d:{xp:5,rep:2,client:1,flags:{sigY3:true}}},fail:{text:'It affects a sensitivity you had not isolated. The expert needs the evening.',d:{energy:-1}},next:'train3'}])},
 review3(){sec('YEAR III · REVIEW');narr('You are no longer evaluated only on output.');tx(`The question has changed: do you understand what the case needs?`);if(S.flags.yaa)result('The association work is mentioned in your review — by a partner you have never worked for. The evenings, it turns out, were not spent. They were invested.',true,{energy:1,life:1});S.year=4;S.level=4;S.energy=Math.min(10,S.energy+2);S.flags.sponsor=true;S.sponsor=0;paintSheet();if(S.rep>=11)awardFeat('Reads the Tribunal');narr('A new field unlocks: SPONSORSHIP. A mentor can teach you. A sponsor is willing to spend influence on you.');cont('y4a')},
 y4a(){sec('YEAR IV · BE SEEN');narr('THE PANEL SLOT');tx(`A partner asks whether you can speak for ten minutes at an arbitration conference after another speaker cancels. The topic is adjacent to your work, but not your specialist subject.`);choices([
 {label:`A — SAY YES\nBuild the talk quickly and take the slot.`,tag:'DRIVE',dc:13,mod:S.attrs.drive,success:{text:'The talk is good enough to create visibility. Two people ask for your slides afterwards. One of them may even open them.',d:{xp:2,rep:2,clientNetwork:1}},fail:{text:'You survive it, but the preparation consumes more energy than the visibility was worth.',d:{energy:-2}},next:'pub4'},
 {label:`B — SAY YES, BUT NARROW THE TOPIC\nPropose a narrower angle you actually know.`,tag:'JUDGMENT',dc:12,mod:S.attrs.judgment,success:{text:'The narrower talk is sharper and more memorable.',d:{xp:3,rep:2,clientNetwork:1}},fail:{text:'The organiser wanted the broader topic. You look slightly difficult.',d:{rep:-1}},next:'pub4'},
 {label:`C — DECLINE\nProtect your time and avoid speaking outside your expertise.`,out:{text:'No downside. Also no upside.',d:{energy:1}},next:'pub4'}])},
 y4assoc(){sec('YEAR IV · THE ASSOCIATION, YEAR TWO');narr('THE LOCAL LEVEL');if(!S.flags.yaa){tx(`The young association's year passes without you. The people who printed name badges last autumn are now being introduced to people in other cities.`);cont('y4b');return}tx(`Second year. The badge-printers of last autumn are given real jobs. The local chapter needs a coordinator — speakers, venues, and the annual dinner that everyone attends and nobody organises.`);choices([
 {label:`A — TAKE THE LOCAL ROLE\nRun the chapter's programme for a year.`,tag:'DRIVE',dc:12,mod:S.attrs.drive,success:{text:'You run the local programme for a year. Every young arbitration lawyer in the city now knows your name, and the national association now knows the chapter runs on time.',d:{clientNetwork:1,rep:1,energy:-1,flags:{yaa:2}}},fail:{text:'The programme happens, mostly despite you. The chapter forgives; coordination is graded on attendance, not elegance. The year still counts.',d:{clientNetwork:1,energy:-1,flags:{yaa:2}}},next:'y4b'},
 {label:`B — JUST KEEP ATTENDING\nThe dinners, nothing more.`,out:{text:'You keep attending. The chapter is run by someone else, competently, and the year passes.',d:{clientNetwork:1}},next:'y4b'}])},
 y4b(){sec('YEAR IV · ENCOUNTER');narr('THE PARTNER WHO NOTICES');tx(`A senior partner from another office asks you to join a pitch because they heard you were good with clients. This is not your matter. Your own team is busy.`);choices([
 {label:`A — JOIN THE PITCH\nMake the time and prepare properly.`,tag:'PRESENCE',dc:14,mod:S.attrs.presence,success:{text:'The pitch goes well. The senior partner starts asking for you by name.',d:{rep:2,internal:2,sponsor:1,energy:-1}},fail:{text:'You are competent but peripheral. Your own workload still suffered.',d:{energy:-2}},next:'y4boss'},
 {label:`B — PROTECT THE MATTER\nDecline because your existing case needs you.`,out:{text:'Your team appreciates the loyalty. The other partner moves on.',d:{internal:1}},next:'y4boss'},
 {label:`C — FIND COVER\nDelegate enough of your current work to join the pitch without dropping the matter.`,tag:'JUDGMENT',dc:14,mod:S.attrs.judgment+1,success:{text:'You create capacity instead of merely working more hours. That is noticed.',d:{xp:2,internal:2,sponsor:1}},fail:{text:'The delegation is too late. You end up doing both jobs badly tired.',d:{energy:-2,life:-1}},next:'y4boss'}])},
 y4boss(){sec('YEAR IV · ORDEAL');narr('THE MATTER WITHOUT THE PARTNER');tx(`The partner is unexpectedly unavailable. The client needs a recommendation on whether to seek emergency relief before Monday.

For the first time, everyone on the call is waiting for you.`);choices([
 {label:`A — GIVE THE RECOMMENDATION
State the preferred route, the principal risk and what must happen next.`,tag:'JUDGMENT',dc:15,mod:S.attrs.judgment,success:{text:'The client accepts the recommendation. The partner later endorses it.',d:{xp:4,client:2,rep:2}},fail:{text:'The recommendation is defensible but too categorical. The partner later has to qualify it.',d:{client:-1}},next:'train4'},
 {label:`B — BUILD CONSENSUS
Take the client through the options and guide the room to a decision.`,tag:'PRESENCE',dc:15,mod:S.attrs.presence,success:{text:'The client leaves the call feeling that the matter is under control.',d:{xp:4,client:2,internal:1}},fail:{text:'The discussion expands instead of converging. The client asks for the partner.',d:{client:-1}},next:'train4'},
 {label:`C — WAIT FOR THE PARTNER
Explain that the recommendation should be confirmed once the partner is available.`,out:{text:'Professional and safe. It also tells the client where authority still sits.',d:{}},next:'train4'},
 {label:`⚔ ARBITRATION COUNSEL — PROCEDURAL INSTINCT
Map the emergency-arbitrator route, jurisdictional threshold and enforceability risk before recommending whether to file.`,tag:'JUDGMENT',dc:13,mod:S.attrs.judgment,subclassOnly:'Arbitration Counsel',ability:'PROCEDURAL INSTINCT',signatureBonus:2,success:{text:'You identify the one procedural route that can produce useful relief in time. The client files for the right remedy, for the right reason.',d:{xp:5,client:2,rep:2,flags:{sigY4:true}}},fail:{text:'The route exists, but the enforcement problem is worse than you first thought. Monday arrives early.',d:{energy:-1}},next:'train4'},
 {label:`⚔ HEARING COUNSEL — ON YOUR FEET
Run the client call like the first ten minutes of an emergency application: issue, evidence, relief, risk, decision.`,tag:'PRESENCE',dc:13,mod:S.attrs.presence,subclassOnly:'Hearing Counsel',ability:'ON YOUR FEET',signatureBonus:2,success:{text:'The call ends with a decision, an evidence list and owners. Nobody asks when the partner is coming back.',d:{xp:5,client:2,internal:1,flags:{sigY4:true}}},fail:{text:'You drive the room hard enough that one commercial assumption gets left behind.',d:{client:-1}},next:'train4'},
 {label:`⚔ INVESTIGATIONS LAWYER — FOLLOW THE RECORD
Before recommending emergency relief, establish what actually happened in the last forty-eight hours.`,tag:'INSTINCT',dc:12,mod:S.attrs.instinct,subclassOnly:'Investigations Lawyer',ability:'FOLLOW THE RECORD',signatureBonus:2,success:{text:'One timestamp changes the urgency analysis. The “emergency” is real, but the trigger is different from what management reported.',d:{xp:5,client:2,rep:1,flags:{sigY4:true}}},fail:{text:'The facts remain contested and the clock keeps running.',d:{energy:-1}},next:'train4'},
 {label:`⚔ QUANTUM SPECIALIST — TEST THE MODEL
Quantify the harm from waiting until Monday and compare it with the cost and downside of emergency relief.`,tag:'CRAFT',dc:13,mod:S.attrs.craft,subclassOnly:'Quantum Specialist',ability:'TEST THE MODEL',signatureBonus:2,success:{text:'The legal urgency sounds dramatic. The quantified downside of waiting is modest. The client avoids an expensive application it did not need.',d:{xp:5,client:2,rep:2,flags:{sigY4:true}}},fail:{text:'The range is too wide to carry the decision. Law has to do the work after all.',d:{xp:1}},next:'train4'}])},
 review4(){sec('YEAR IV · REVIEW');narr('Visibility is now a career asset.');tx(`Some people know your work. A smaller number are willing to create opportunities for you.`);S.year=5;S.level=5;S.energy=Math.min(10,S.energy+2);paintSheet();if(S.internal>=5)awardFeat('Sends the Short Email');cont('y5conf')},
 y5conf(){sec('YEAR V · THE ASSOCIATION, YEAR THREE');narr('THE NATIONAL CONFERENCE');if(S.flags.yaa>=2){tx(`The national young practitioners' conference asks the local coordinators for panel speakers. Your chapter puts your name forward.\n\nForty minutes, four hundred lawyers, one microphone that will be too loud.`);choices([
 {label:`A — TAKE THE PANEL\nForty minutes on a subject you actually know.`,tag:'PRESENCE',dc:13,mod:S.attrs.presence,success:{text:'Forty minutes, and you are funny exactly once, on purpose. Afterwards, people from four cities introduce themselves. The national level now has a face for your name.',d:{clientNetwork:2,rep:1,flags:{yaa:3}}},fail:{text:'The microphone is too loud and the moderator mispronounces your name twice. The contacts arrive anyway — conferences remember attendance longer than performance.',d:{clientNetwork:1,energy:-1,flags:{yaa:3}}},next:'y5a'},
 {label:`B — DECLINE THE SLOT\nThe practice needs the week more than the podium.`,out:{text:'Someone else takes the slot. The national level remains, for you, a newsletter.',d:{}},next:'y5a'}])}else if(S.flags.yaa===1){tx(`The national conference asks the local coordinators for panel speakers.\n\nYou attended dinners. Dinners, it turns out, are not coordination.`);cont('y5a')}else{tx(`The young association holds its national conference. You read about it afterwards, briefly, on the way to something billable.`);cont('y5a')}},
 y5a(){sec('YEAR V · OWN');narr('THE CLIENT CALLS YOU');tx(`Sunday, 09:12. A client calls your mobile directly. A regulator has appeared at one of its sites. The partner does not answer. The partner's out-of-office reply is from March.`);choices([
 {label:`A — TAKE CONTROL\nGive immediate instructions, mobilise the team and update the partner.`,tag:'PRESENCE',dc:15,mod:S.attrs.presence,success:{text:'The client follows the plan. By the time the partner calls back, the first hour has been handled.',d:{xp:4,client:2,rep:2}},fail:{text:'You move too fast and miss a factual uncertainty. The team corrects course.',d:{energy:-1}},next:'y5b'},
 {label:`B — DIAGNOSE FIRST\nAsk the questions that determine what kind of problem this actually is.`,tag:'INSTINCT',dc:14,mod:S.attrs.instinct,success:{text:'The apparent crisis is narrower than it first sounded. You save the client from overreacting.',d:{xp:4,client:2}},fail:{text:'The questions take too long. The client wanted direction.',d:{client:-1}},next:'y5b'},
 {label:`C — CALL SOMEBODY MORE SENIOR\nWake another partner and hand the first hour upward.`,tag:'INSTINCT',dc:13,mod:S.attrs.instinct,success:{text:'The other partner takes the call, takes the point and takes surprisingly little of the credit. The first hour is handled by somebody who has done this before.',d:{xp:2,internal:1}},fail:{text:'You are remembered as the person who called at 09:14 on a Sunday.',d:{internal:-1}},next:'y5b'}])},
 y5b(){sec('YEAR V · ENCOUNTER');narr('THE JUNIOR WHO IS STRUGGLING');tx(`A junior associate on your team is missing deadlines and making avoidable mistakes. The hearing is six weeks away.`);choices([
 {label:`A — TAKE THE WORK BACK\nProtect the case and do the key tasks yourself.`,tag:'GRIT',dc:12,mod:S.attrs.grit,success:{text:'The work gets done. Your capacity disappears.',d:{rep:1,energy:-2}},fail:{text:'You absorb too much and still cannot keep up.',d:{energy:-3,life:-1}},next:'pub5'},
 {label:`B — MANAGE THE PERSON\nHave the difficult conversation, reset expectations and give structured responsibility.`,tag:'PRESENCE',dc:14,mod:S.attrs.presence,success:{text:'Performance improves. More importantly, someone else can now carry weight.',d:{xp:3,rep:2,internal:1}},fail:{text:'The conversation lands badly. The work still needs close supervision.',d:{energy:-1}},next:'pub5'},
 {label:`C — ESCALATE\nAsk staffing to move the junior off the case.`,tag:'JUDGMENT',dc:13,mod:S.attrs.judgment,success:{text:'The move is accepted as necessary and handled discreetly.',d:{rep:1}},fail:{text:'The request is seen as premature. You are expected to manage the problem.',d:{internal:-1}},next:'pub5'}])},
 y5boss(){sec('YEAR V · ORDEAL');narr('THE CLIENT CRISIS');tx(`A settlement offer expires in two hours. The economics are attractive, but accepting it would abandon an argument the business has defended internally for years.

The client asks: “What would you do?”

It is not a rhetorical question. It is also not entirely a legal one.`);choices([
 {label:`A — ANSWER DIRECTLY
Recommend accept or reject and own the advice.`,tag:'JUDGMENT',dc:16,mod:S.attrs.judgment,success:{text:'Your recommendation is commercially grounded and legally defensible. The client acts on it.',d:{xp:5,client:2,rep:2,clientNetwork:1}},fail:{text:'The recommendation is too legalistic for the decision the client actually has to make.',d:{client:-1}},next:'train5'},
 {label:`B — FRAME THE DECISION
Separate legal merits, economics and internal business consequences, then let the client choose.`,tag:'PRESENCE',dc:15,mod:S.attrs.presence,success:{text:'The client makes the decision with clarity and remembers who made the complexity manageable.',d:{xp:4,client:2,clientNetwork:1}},fail:{text:'The framework is elegant but feels evasive when the client wanted advice.',d:{client:-1}},next:'train5'},
 {label:`⚔ ARBITRATION COUNSEL — PROCEDURAL INSTINCT
Price the procedural path if settlement fails: hearing timetable, interim steps, costs and enforcement risk.`,tag:'JUDGMENT',dc:13,mod:S.attrs.judgment,subclassOnly:'Arbitration Counsel',ability:'PROCEDURAL INSTINCT',signatureBonus:2,success:{text:'The client sees what “continue the case” actually means over the next eighteen months. The settlement decision becomes concrete.',d:{xp:5,client:2,rep:2,flags:{sigY5:true}}},fail:{text:'The procedural map is accurate but does not answer the commercial question quickly enough.',d:{client:-1}},next:'train5'},
 {label:`⚔ HEARING COUNSEL — ON YOUR FEET
Run a ten-minute decision conference and force the unresolved assumptions into the open.`,tag:'PRESENCE',dc:13,mod:S.attrs.presence,subclassOnly:'Hearing Counsel',ability:'ON YOUR FEET',signatureBonus:2,success:{text:'The GC and CFO discover they disagree about the business objective, not the merits. Once stated aloud, the settlement decision becomes obvious.',d:{xp:5,client:2,clientNetwork:1,flags:{sigY5:true}}},fail:{text:'The room becomes a debate when it needed a decision.',d:{client:-1}},next:'train5'},
 {label:`⚔ INVESTIGATIONS LAWYER — FOLLOW THE RECORD
Recheck the factual assumption on which management’s refusal to settle is based.`,tag:'INSTINCT',dc:12,mod:S.attrs.instinct,subclassOnly:'Investigations Lawyer',ability:'FOLLOW THE RECORD',signatureBonus:2,success:{text:'The supposedly immovable fact rests on one witness’s recollection. The client stops treating litigation posture as corporate history.',d:{xp:5,client:2,rep:2,flags:{sigY5:true}}},fail:{text:'The factual premise survives the check. The clock has lost twenty minutes.',d:{energy:-1}},next:'train5'},
 {label:`⚔ QUANTUM SPECIALIST — TEST THE MODEL
Compare the offer with the probability-weighted value of the case, including costs, delay and downside scenarios.`,tag:'CRAFT',dc:12,mod:S.attrs.craft,subclassOnly:'Quantum Specialist',ability:'TEST THE MODEL',signatureBonus:2,success:{text:'The number is uncomfortable precisely because it is useful. The offer is above the modelled value. The board has something firmer than pride to vote on.',d:{xp:5,client:2,rep:2,clientNetwork:1,flags:{sigY5:true}}},fail:{text:'The model is exquisitely sensitive to an assumption nobody can resolve in two hours.',d:{energy:-1}},next:'train5'}])},
 review5(){sec('YEAR V · REVIEW');narr('Ownership changes the relationship.');tx(`Clients increasingly call you. Juniors increasingly depend on you. The firm begins to ask whether those relationships can become portable value.`);S.year=6;S.level=6;S.flags.business=true;S.business=Math.max(1,Math.round(((S.clientNetwork||1)+(S.client||0)+(S.sponsor||0))/3));S.energy=Math.min(10,S.energy+2);paintSheet();if(S.client>=5)awardFeat('Delegates Without Guilt');narr('BUSINESS CASE unlocks. The number is uncomfortable because it measures something different from legal excellence.');cont('y6conf')},
 y6conf(){if(S.flags.yaa<2){go('y6a');return}sec('YEAR VI · THE ASSOCIATION, YEAR FOUR');narr('THE CONFERENCE');if(S.flags.yaa>=3){tx(`Three years of name badges, programmes and one loud microphone later, the committee asks you to chair the national conference itself.\n\nThis is not a reward. It is a test with catering.`);choices([
 {label:`A — CHAIR IT\nProgramme, speakers, sponsors, and the seating politics of four hundred lawyers.`,tag:'DRIVE',dc:13,mod:S.attrs.drive,success:{text:'The conference runs. Four hundred people watch you open it, close it, and quietly fix the one thing that breaks in between. For a day, you are the association.',d:{clientNetwork:2,rep:2,internal:1,energy:-1,life:-1,flags:{yaa:4},feat:'Convenes the Room'}},fail:{text:'The keynote cancels at 07:40 and you learn, in public, what a programme B is for. The conference survives. So does your reputation — and everyone saw who was holding it together.',d:{clientNetwork:2,rep:1,energy:-2,life:-1,flags:{yaa:4}}},next:'y6a'},
 {label:`B — DECLINE THE CHAIR\nThe partnership year needs you more.`,out:{text:'Somebody else chairs it. You are thanked in the closing remarks — which is where careers go to be remembered politely.',d:{clientNetwork:1}},next:'y6a'}])}else{tx(`The national conference is chaired by one of last year's panel speakers.\n\nPanels, it turns out, were the audition.`);cont('y6a')}},
 y6a(){sec('YEAR VI · BUILD');narr('THE ORIGINATED MATTER');tx(`${S.flags.yaa?'A peer from the young association — in-house counsel now — calls:':'A contact you have known for several years calls:'}\n\n“We may have a problem. Could you take a look?”\n\n${S.flags.article?'They mention, in passing, a one-page article you wrote for a newsletter years ago. You had almost forgotten it. They had not.\n\n':''}No partner introduced the opportunity. It came to you.`);choices([
 {label:`A — CONVERT THE MANDATE\nDiagnose the issue, scope the first step and ask for the instruction.`,tag:'PRESENCE',dc:16,mod:S.attrs.presence+((S.flags.article||S.flags.yaa)?1:0),success:{text:'The client instructs the firm. Your name is attached to the origin of the matter.',d:{xp:5,client:2,clientNetwork:2,business:2,sponsor:1}},fail:{text:'The conversation is good, but the contact shops the matter elsewhere.',d:{clientNetwork:1}},next:'y6press'},
 {label:`B — BRING IN A PARTNER EARLY\nUse internal credibility to strengthen the pitch.`,tag:'INSTINCT',dc:14,mod:S.attrs.instinct,success:{text:'You use the firm well without disappearing from the relationship.',d:{internal:1,client:1,clientNetwork:1,business:1}},fail:{text:'The partner takes over the relationship. The matter comes in, but your ownership is blurred.',d:{internal:1}},next:'y6press'},
 {label:`C — GIVE FREE ADVICE FIRST\nHelp without asking for an engagement and hope the mandate follows.`,tag:'DRIVE',dc:15,mod:S.attrs.drive,success:{text:'The goodwill converts into a mandate.',d:{client:1,business:1}},fail:{text:'The contact is grateful. Another firm is instructed.',d:{}},next:'y6press'}])},
 y6press(){sec('YEAR VI · READ');narr('THE NEWSPAPER');tx(`Saturday, 08:40.\n\nThe business pages report that a party about to enter government intends to block the final permit for a car factory that a foreign automotive group is already building. The plant is designed to build combustion engines. The incoming coalition is designed to end them.\n\nThe earlier permits date back years. The concrete is poured. The presses are ordered.\n\nThe article discusses the coalition, the election and the climate targets. It does not mention the investment treaty. Nobody quoted in it appears to have read one.\n\nYou read the piece twice. There is a treaty. There is, as far as you can tell, a case.${S.flags.yaa>=4?'\n\nThe group\'s deputy general counsel sat in the second row of the national conference you chaired. A call is not cold at all when the other side has watched you run a room.':S.flags.yaa===3?'\n\nThe group\'s deputy general counsel asked a question from the floor after your panel last year. A call is warmer when the other side has heard you think.':S.flags.yaa?'\n\nYou have also met the group\'s deputy general counsel once, at a young association dinner. A cold call is never entirely cold if you can open with a name.':''}\n\nThe group is not a client. Nobody knows you are reading this.`);choices([
 {label:`A — THE DIRECT APPROACH\n${S.flags.article?'Send your one-page article with a single sentence attached, then call the general counsel on Monday.':'Find the general counsel\'s number and call cold on Monday morning.'}`,tag:'DRIVE',dc:18,mod:S.attrs.drive+(S.flags.yaa>=4?3:S.flags.yaa?2:0)+(S.flags.article?1:0),success:{text:`${S.flags.article?'The page does the introduction; the single sentence does the rest. The general counsel calls back before lunch, and nobody has to decide whether the approach was a pitch. Two meetings later, the firm is instructed in a treaty arbitration measured in nine figures. The origination is yours, undiluted.':'Improbably, the general counsel takes the call — mainly because your first minute corrects something the newspaper got wrong. Two meetings later, the firm is instructed in a treaty arbitration measured in nine figures. The origination is yours, undiluted.'}`,d:{xp:5,client:2,clientNetwork:3,business:3,rep:2}},fail:{text:'“Thank you for your interest. We are well advised.” The call lasts ninety seconds. The general counsel is polite, which somehow makes it worse.',d:{energy:-1}},next:'y6b'},
 {label:`B — THE WARM PATH\nA partner two floors up sits on a committee with the group's CFO. Bring the idea upstairs first.`,tag:'JUDGMENT',dc:13,mod:S.attrs.judgment+1,success:{text:'The introduction takes one phone call. The pitch takes three weeks. The mandate — an arbitration the press will later call “high-stakes” — comes in. The origination credit is shared. The relationship, in time, is not.',d:{xp:4,client:2,clientNetwork:2,business:2,internal:2,sponsor:1}},fail:{text:'The partner finds the idea “interesting” and promises to raise it. Weeks pass. Another firm files the case you diagnosed first.',d:{internal:1}},next:'y6b'},
 {label:`C — THE SEMINAR\nDesign a client seminar on political risk and investment protection and invite the group's legal team, among forty others.`,tag:'DRIVE',dc:15,mod:S.attrs.drive,success:{text:'They come. They sit in the second row and ask three questions that are not hypothetical. The follow-up meeting is scheduled before the coffee is cleared; the instruction, when it arrives, is for the full arbitration.',d:{xp:4,client:2,clientNetwork:2,business:2,rep:1}},fail:{text:'They do not come. Forty other people do, and the slides circulate. The seminar was not wasted. It was merely not aimed.',d:{clientNetwork:1,rep:1,energy:-1}},next:'y6b'}])},
 y6b(){sec('YEAR VI · ENCOUNTER');narr('THE SPONSOR');tx(`A partner who has supported you tells you privately:\n\n“If you want partnership, next year matters. I can help, but I need a case I can make for you.”`);choices([
 {label:`A — ASK WHAT THE CASE NEEDS\nInvite direct feedback on the gaps in your partnership case.`,tag:'JUDGMENT',dc:13,mod:S.attrs.judgment,success:{text:'You receive uncomfortable, specific information while there is still time to act on it.',d:{sponsor:2,internal:1,business:1}},fail:{text:'The conversation remains vague. Support exists, but the case is still fuzzy.',d:{sponsor:1}},next:'pub6'},
 {label:`B — SELL YOUR RECORD\nMake the affirmative case for your performance, clients and trajectory.`,tag:'PRESENCE',dc:15,mod:S.attrs.presence,success:{text:'The partner leaves with language they can use in the room when you are absent.',d:{sponsor:2,business:1}},fail:{text:'You sound more polished than concrete.',d:{sponsor:1}},next:'pub6'},
 {label:`C — KEEP YOUR OPTIONS OPEN\nDo not commit to the partnership track yet.`,out:{text:'You preserve optionality. The partner respects it, but sponsorship cools.',d:{sponsor:-1,life:1}},next:'pub6'}])},
 y6boss(){sec('YEAR VI · ORDEAL');narr('THE BUSINESS CASE');tx(`Practice leadership asks for your draft partnership business case.

The template has sections for: clients, pipeline, market profile, leadership, economics and strategic fit.

There is no box labelled “excellent lawyer.” There is a word limit.`);choices([
 {label:`A — BUILD THE NUMBERS
Base the case on matters, clients and credible pipeline.`,tag:'CRAFT',dc:15,mod:S.attrs.craft,success:{text:'The case is specific and financially legible.',d:{business:2,rep:1}},fail:{text:'The document is accurate but reads like a CV rather than a business case.',d:{business:0}},next:'train6'},
 {label:`B — BUILD THE STORY
Explain why the practice will need you and what you will own.`,tag:'JUDGMENT',dc:16,mod:S.attrs.judgment,success:{text:'The case connects your record to a future role the firm can understand.',d:{business:2,sponsor:1}},fail:{text:'The strategic story outruns the evidence.',d:{business:0}},next:'train6'},
 {label:`C — BUILD BOTH
Spend the time to combine economics and strategic narrative.`,tag:'GRIT',dc:15,mod:S.attrs.grit+1,success:{text:'It is the first document in the game where your legal skills are almost beside the point.',d:{business:3,energy:-2}},fail:{text:'You overwork the document and lose clarity.',d:{energy:-2,business:1}},next:'train6'},
 {label:`⚔ ARBITRATION COUNSEL — OWN A PROCEDURAL MARKET
Build the case around being the person clients call when jurisdiction, treaty architecture and procedure determine the dispute before merits begin.`,tag:'JUDGMENT',dc:14,mod:S.attrs.judgment,subclassOnly:'Arbitration Counsel',ability:'PROCEDURAL INSTINCT',signatureBonus:2,success:{text:'The specialism becomes a market proposition rather than a biography. Leadership can name what you own.',d:{business:3,sponsor:1,flags:{sigY6:true}}},fail:{text:'The niche is credible but too narrow as presented. The business case needs clients, not taxonomy.',d:{business:1}},next:'train6'},
 {label:`⚔ HEARING COUNSEL — OWN THE ROOM
Build the case around hearings, advocacy and being trusted with the moments clients remember.`,tag:'PRESENCE',dc:14,mod:S.attrs.presence,subclassOnly:'Hearing Counsel',ability:'ON YOUR FEET',signatureBonus:2,success:{text:'Your hearing record becomes a business proposition: senior responsibility clients can buy and partners can sell.',d:{business:3,sponsor:1,flags:{sigY6:true}}},fail:{text:'“Good advocate” is praise. It is not yet a pipeline.',d:{business:1}},next:'train6'},
 {label:`⚔ INVESTIGATIONS LAWYER — OWN THE FACTS
Build the case around high-stakes factual work: witnesses, internal investigations and cases won before the pleading is written.`,tag:'INSTINCT',dc:14,mod:S.attrs.instinct,subclassOnly:'Investigations Lawyer',ability:'FOLLOW THE RECORD',signatureBonus:2,success:{text:'The practice sees a repeatable product: when the facts are dangerous, you are the person who makes them knowable.',d:{business:3,sponsor:1,flags:{sigY6:true}}},fail:{text:'The expertise is valued, but the draft does not yet show how it originates work.',d:{business:1}},next:'train6'},
 {label:`⚔ QUANTUM SPECIALIST — OWN THE NUMBER
Build the case around disputes where valuation, experts and damages drive strategy.`,tag:'CRAFT',dc:14,mod:S.attrs.craft,subclassOnly:'Quantum Specialist',ability:'TEST THE MODEL',signatureBonus:2,success:{text:'You show a proposition the firm can sell: legal strategy that understands the number before the expert report arrives.',d:{business:3,sponsor:1,flags:{sigY6:true}}},fail:{text:'The technical edge is obvious. The commercial ownership is not yet.',d:{business:1}},next:'train6'}])},
 review6(){sec('YEAR VI · REVIEW');narr('PARTNERSHIP DASHBOARD');app.insertAdjacentHTML('beforeend',`<div class="review"><b>CRAFT</b> ${S.attrs.craft}<br><b>JUDGMENT</b> ${S.attrs.judgment}<br><b>REPUTATION</b> ${S.rep}/10<br><b>CLIENT TRUST</b> ${S.client}/10<br><b>INTERNAL CAPITAL</b> ${S.internal}/10<br><b>CLIENT NETWORK</b> ${S.clientNetwork||0}/10<br><b>SPONSORSHIP</b> ${S.sponsor||0}/10<br><b>BUSINESS CASE</b> ${S.business||0}/10<br><b>LIFE</b> ${S.life}/10</div>`);S.year=7;S.level=7;S.energy=Math.min(10,S.energy+1);paintSheet();if(S.business>=5)awardFeat('Survives the Redline');cont('y7choice')},
 y7choice(){sec('YEAR VII · CHOOSE');narr('WHAT ARE YOU TRYING TO ACHIEVE?');tx(`For six years the game has mostly told you what advancement looks like.\n\nNow you choose the objective.`);choices([
 {label:`A — PARTNERSHIP\nPut your case forward.`,out:{text:'You enter the final year on the partnership track.',d:{}},next:'y7partner'},
 {label:`B — COUNSEL\nPrioritise expertise, autonomy and interesting work over ownership economics.`,out:{text:'You pursue a counsel role on your own terms.',d:{life:1}},next:'endingCounsel'},
 {label:`C — IN-HOUSE\nFollow the client side of the relationship.`,out:{text:'You begin taking the client calls that are about your own future.',d:{life:1}},next:'endingInhouse'},
 {label:`D — BUILD SOMETHING ELSE\nExplore another firm or a boutique.`,out:{text:'You decide that seven years of accumulated skill and relationships are portable.',d:{life:1}},next:'endingOther'}])},
 y7partner(){sec('YEAR VII · THE VERDICT');narr('THE COMMITTEE');tx(`You do not attend.\n\nYour sponsor does.\n\nFor the first time in the game, your agency is deliberately limited. The previous six years are the evidence.\n\nPart of the answer is the firm's own arithmetic — room, succession, economics. The dice are honest about something most firms are not.\n\nYou spend the afternoon on client work. It does not help. It is at least billable.`);const score=(S.rep+S.client+S.internal+(S.clientNetwork||0)+(S.sponsor||0)+(S.business||0))/6;const sigWins=['sigY3','sigY4','sigY5','sigY6'].filter(k=>S.flags[k]).length;const specialistFit=sigWins>=3?1:sigWins>=2?0.5:0;const firm=1+Math.floor(Math.random()*20);const total=score+firm/4+specialistFit;app.insertAdjacentHTML('beforeend',`<div class="die"><span class="big">${firm}</span><span class="small">FIRM NEEDS · D20${specialistFit?` · SPECIALIST FIT +${specialistFit}`:''}</span></div>`);let text,next;if(total>=12){text='The practice has room, the business case is credible and enough people are willing to argue for you. The committee approves.';next='endingPartner'}else if(total>=9){text='The room is positive on you, but uncertain on timing or economics. The answer is: not yet.';next='endingSalary'}else{text='The legal record is respected. The business case does not clear the institutional threshold this year.';next='endingGolden'}result(text,total>=12,{}) ;cont(next)},
 endingPartner(){endingScreen('EQUITY PARTNER','You reached the traditional ending. The game now becomes considerably less turn-based.')},
 endingSalary(){endingScreen('SALARY PARTNER','The firm wants to keep you close while the commercial case develops. You have advanced. The final gate remains.')},
 endingGolden(){endingScreen('THE GOLDEN TECHNICIAN','The firm describes you as indispensable. Curiously, this is not the same word as partner.')},
 endingCounsel(){endingScreen('COUNSEL','You choose depth, autonomy and a role built around expertise. The title is not a consolation prize unless you treat it like one.')},
 endingInhouse(){endingScreen('IN-HOUSE','A client relationship becomes a career move. Your billable target falls dramatically. The emails do not.')},
 endingOther(){endingScreen('THE OTHER PATH','Another firm, a boutique or something you have not yet named. The seven years were not wasted XP.')}
};
function endingScreen(title,body){sec('FINAL ENDING');narr(title);tx(body);const ep=[];if(S.life<=3)ep.push('The plant did not survive Year IV.');if(S.life>=8)ep.push('Improbably, you still have hobbies. Plural.');if(S.client>=8&&(title==='COUNSEL'||title==='IN-HOUSE'))ep.push('Three clients ask, carefully, what this means for them.');if(S.energy<=2&&title==='EQUITY PARTNER')ep.push('You celebrate briefly. Then you sleep for eleven hours.');if(ep.length)tx(ep.join('\n'));app.insertAdjacentHTML('beforeend',`<div class="review"><b>FINAL CHARACTER${S.name?' — '+S.name.toUpperCase():''}</b><br><br>Reputation: ${S.rep}/10<br>Client Trust: ${S.client}/10<br>Internal Capital: ${S.internal}/10<br>Client Network: ${S.clientNetwork||0}/10<br>Sponsorship: ${S.sponsor||0}/10<br>Business Case: ${S.business||0}/10<br>Life: ${S.life}/10<br>Energy: ${S.energy}/10</div>`);const b=document.createElement('button');b.className='cont';b.textContent='RESTART';b.onclick=resetGame;app.appendChild(b)}
document.getElementById('startGame').addEventListener('click',()=>{
  document.getElementById('coverScreen').classList.add('hidden');
  document.getElementById('gameShell').classList.remove('hidden');
  document.getElementById('restartGame').classList.remove('hidden');
  resetGame();
});
document.getElementById('restartGame').addEventListener('click',()=>{
  if(confirm('Restart the career from the beginning? Progress will not be portable.')) resetGame();
});
</script></body></html>
